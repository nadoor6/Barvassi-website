<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Reset Password</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="logo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: rgba(20,20,20,0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 32px 80px rgba(0,0,0,0.7);
            text-align: center;
        }
        .reset-card .logo { max-width: 120px; height: auto; margin-bottom: 16px; opacity: 0.9; }
        .reset-card .logo-fallback {
            font-family: 'SF Pro Display', sans-serif;
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #f2f2f2;
            margin-bottom: 8px;
            display: none;
        }
        .reset-card h1 { font-weight: 400; font-size: 26px; letter-spacing: 0.04em; color: #f2f2f2; margin-bottom: 4px; }
        .reset-card .sub {
            font-weight: 300;
            font-size: 14px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 32px;
        }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-label {
            display: block;
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.35);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #f2f2f2;
            outline: none;
            transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
        }
        .form-input:focus {
            border-color: rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 2px rgba(255,255,255,0.02);
        }
        .form-input.error {
            border-color: rgba(180,40,40,0.5);
            box-shadow: 0 0 0 2px rgba(180,40,40,0.04);
        }
        .btn1 {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 14px 0;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 8px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .btn1:hover { background: #2a2a2a; transform: scale(1.02); }
        .btn1:active { transform: scale(0.96); }
        .btn1.loading { pointer-events: none; background: #2a2a2a; transform: scale(1); }
        .btn1 .btn-text { transition: opacity 0.4s ease; }
        .btn1.loading .btn-text { opacity: 0; }
        .btn1 .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            width: 22px;
            height: 22px;
        }
        .btn1.loading .spinner { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .spinner svg { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            pointer-events: none;
        }
        #toast {
            background: rgba(12,12,12,0.8);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 28px;
            color: #f2f2f2;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 14px;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        #toast.error { border-color: rgba(180,40,40,0.3); background: rgba(30,10,10,0.8); }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            transition: color 0.3s;
            letter-spacing: 0.05em;
        }
        .back-link:hover { color: rgba(255,255,255,0.5); }

        .error-msg {
            text-align: center;
            font-size: 12px;
            color: rgba(180,40,40,0.7);
            margin-top: 12px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .error-msg.visible { opacity: 1; }

        @media (max-width: 480px) {
            .reset-card { padding: 32px 20px; }
            .reset-card h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <img id="logoImg" src="" alt="Barvassi" class="logo" />
        <div id="logoFallback" class="logo-fallback">Barvassi</div>

        <h1>Reset Password</h1>
        <div class="sub" id="statusMessage">Enter your new password below.</div>

        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-input" id="newPassInput" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" id="confirmPassInput" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <button class="btn1" id="resetBtn">
            <span class="btn-text">Update Password</span>
            <div class="spinner">
                <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
                    <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" />
                </svg>
            </div>
        </button>

        <div class="error-msg" id="errorMsg"></div>

        <a href="/" class="back-link">← Back to Sign In</a>
    </div>

    <div id="toast-container">
        <div id="toast">
            <span id="toast-message">Success</span>
        </div>
    </div>

    <script>
        console.log("🔐 Reset Password Page Loaded");

        // ─── Toast (Smooth Queue) ──────────────────────────────────────
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        let toastQueue = [];
        let toastProcessing = false;
        let toastHideTimeout = null;

        function showToast(message, type = 'success') {
            toastQueue.push({ message, type });
            if (!toastProcessing) {
                processToastQueue();
            }
        }

        function processToastQueue() {
            if (toastQueue.length === 0) {
                toastProcessing = false;
                return;
            }
            toastProcessing = true;
            const { message, type } = toastQueue.shift();

            clearTimeout(toastHideTimeout);

            if (toast.classList.contains('show')) {
                toast.classList.remove('show');
                setTimeout(() => {
                    showToastContent(message, type);
                }, 400);
            } else {
                showToastContent(message, type);
            }
        }

        function showToastContent(message, type) {
            toastMsg.textContent = message;
            toast.classList.remove('error');
            if (type === 'error') toast.classList.add('error');
            toast.classList.add('show');

            toastHideTimeout = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    processToastQueue();
                }, 400);
            }, 5000);
        }

        // ─── Logo ──────────────────────────────────────────────────────
        function loadLogo() {
            const img = document.getElementById('logoImg');
            const fallback = document.getElementById('logoFallback');
            if (typeof BARVASSI_LOGO === 'string' && BARVASSI_LOGO.startsWith('data:image')) {
                img.src = BARVASSI_LOGO;
                img.style.display = 'block';
                fallback.style.display = 'none';
            } else {
                img.style.display = 'none';
                fallback.style.display = 'block';
            }
        }

        // ─── Supabase ──────────────────────────────────────────────────
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: { storage: localStorage, autoRefreshToken: true, persistSession: true }
                });
            } else {
                console.error("❌ Keys are missing!");
                document.getElementById('statusMessage').textContent = 'Configuration error.';
            }
        } catch (e) {
            console.error('❌ Supabase init error:', e);
        }

        // ─── DOM Refs ──────────────────────────────────────────────────
        const newPassInput = document.getElementById('newPassInput');
        const confirmPassInput = document.getElementById('confirmPassInput');
        const resetBtn = document.getElementById('resetBtn');
        const errorMsg = document.getElementById('errorMsg');
        const statusMessage = document.getElementById('statusMessage');

        // ─── Check Session (Recovery) ──────────────────────────────────
        let recoverySession = null;

        async function checkRecoverySession() {
            if (!supabaseClient) return;

            const { data, error } = await supabaseClient.auth.getSession();

            if (error) {
                console.error('Session error:', error);
                statusMessage.textContent = 'Error validating reset link.';
                return;
            }

            if (!data.session) {
                statusMessage.textContent = 'This reset link is invalid or has expired.';
                resetBtn.disabled = true;
                resetBtn.style.opacity = '0.3';
                resetBtn.style.cursor = 'not-allowed';
                return;
            }

            recoverySession = data.session;
            statusMessage.textContent = 'Enter your new password below.';
            console.log('✅ Recovery session active for:', data.session.user.email);
        }

        // ─── Reset Password ────────────────────────────────────────────
        resetBtn.addEventListener('click', async function() {
            if (!supabaseClient || !recoverySession) {
                errorMsg.textContent = 'No active reset session. Please request a new link.';
                errorMsg.classList.add('visible');
                return;
            }

            const newPass = newPassInput.value.trim();
            const confirmPass = confirmPassInput.value.trim();

            errorMsg.classList.remove('visible');

            if (!newPass || newPass.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters.';
                errorMsg.classList.add('visible');
                newPassInput.classList.add('error');
                return;
            }

            if (newPass !== confirmPass) {
                errorMsg.textContent = 'Passwords do not match.';
                errorMsg.classList.add('visible');
                confirmPassInput.classList.add('error');
                return;
            }

            newPassInput.classList.remove('error');
            confirmPassInput.classList.remove('error');

            this.classList.add('loading');

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPass
                });

                if (error) {
                    console.error('Update error:', error);
                    errorMsg.textContent = error.message || 'Failed to update password.';
                    errorMsg.classList.add('visible');
                    this.classList.remove('loading');
                    return;
                }

                showToast('Password updated successfully! 🎉');

                window.location.hash = '';

                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);

            } catch (err) {
                console.error('Unexpected error:', err);
                errorMsg.textContent = 'Something went wrong. Please try again.';
                errorMsg.classList.add('visible');
                this.classList.remove('loading');
            }
        });

        // ─── Clear error on focus ──────────────────────────────────────
        newPassInput.addEventListener('focus', function() {
            this.classList.remove('error');
            errorMsg.classList.remove('visible');
        });
        confirmPassInput.addEventListener('focus', function() {
            this.classList.remove('error');
            errorMsg.classList.remove('visible');
        });

        // ─── Enter key support ─────────────────────────────────────────
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') resetBtn.click();
        });

        // ─── Init ──────────────────────────────────────────────────────
        loadLogo();
        checkRecoverySession();
    </script>
</body>
</html>
