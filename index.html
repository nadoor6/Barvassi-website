    <script src="config.js"></script>

    <style>
        /* ─── Reset & Base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }

        /* ─── Page Transition ─── */
        .page-transition {
            position: fixed;
            inset: 0;
            background: #0c0c0c;
            z-index: 9999;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .page-transition.hidden { opacity: 0; }

        /* ─── Loading Overlay ─── */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #0c0c0c;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.hidden { display: none; }
        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #fafafa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── Split Screen ─── */
        .split-screen {
            display: none;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
        }
        .split-screen.visible { display: flex; }

        /* ─── Left Panel (Image) ─── */
        .left-panel {
            flex: 1.2;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-color: #1a1a1a;
        }
        .left-panel .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 1;
            pointer-events: none;
        }
        /* Optional subtle texture overlay – we keep it clean */

        /* ─── Right Panel (Form) ─── */
        .right-panel {
            flex: 1;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 48px;
            position: relative;
        }

        .form-container {
            width: 100%;
            max-width: 380px;
            text-align: left;
        }

        /* ─── Brand Icon (Lightning Bolt) ─── */
        .brand-icon {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: #1a1a1a;
        }

        /* ─── Typography ─── */
        .form-title {
            font-weight: 500;
            font-size: 32px;
            letter-spacing: -0.02em;
            color: #1a1a1a;
            line-height: 1.2;
            margin-bottom: 4px;
            text-align: center;
        }
        .form-sub {
            font-weight: 300;
            font-size: 15px;
            color: rgba(26,26,26,0.5);
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        /* ─── Social Buttons ─── */
        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: transparent;
            border: 1px solid rgba(26,26,26,0.15);
            border-radius: 50px;
            padding: 10px 0;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 400;
            font-size: 13px;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.02em;
        }
        .social-btn:hover {
            border-color: rgba(26,26,26,0.3);
            background: rgba(26,26,26,0.02);
        }
        .social-btn .icon {
            font-size: 16px;
            font-weight: 500;
        }

        /* ─── Divider ─── */
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0 28px;
            color: rgba(26,26,26,0.2);
            font-size: 12px;
            letter-spacing: 0.05em;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(26,26,26,0.08);
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }

        /* ─── Form Fields ─── */
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: rgba(26,26,26,0.4);
            margin-bottom: 4px;
        }
        .form-input {
            width: 100%;
            background: #f5f5f5;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 15px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.3s ease;
        }
        .form-input:focus {
            border-color: #1a1a1a;
            background: #ffffff;
        }
        .form-input::placeholder {
            color: rgba(26,26,26,0.25);
            font-weight: 300;
        }

        /* ─── Primary Button ─── */
        .btn1 {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 14px 0;
            font-weight: 400;
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 4px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .btn1:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .btn1:active { transform: scale(0.96); }
        .btn1.loading {
            pointer-events: none;
            background: #2a2a2a;
            transform: scale(1);
        }
        .btn1 .btn-text { transition: opacity 0.4s ease; }
        .btn1.loading .btn-text { opacity: 0; }
        .btn1 .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            width: 22px;
            height: 22px;
        }
        .btn1.loading .spinner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .spinner svg { animation: spin 0.9s linear infinite; }

        /* ─── Error Message ─── */
        .error-msg {
            text-align: center;
            font-size: 12px;
            color: rgba(180,40,40,0.7);
            margin-top: 12px;
            height: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .error-msg.visible { opacity: 1; }

        /* ─── Toggle Link ─── */
        .toggle-text {
            text-align: center;
            margin-top: 18px;
            font-weight: 300;
            font-size: 13px;
            color: rgba(26,26,26,0.4);
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-text:hover {
            color: rgba(26,26,26,0.7);
        }
        .toggle-text strong {
            font-weight: 500;
            color: #1a1a1a;
        }

        /* ─── Footer Links ─── */
        .footer-links {
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.05em;
            color: rgba(26,26,26,0.2);
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid rgba(26,26,26,0.04);
        }
        .footer-links a {
            color: inherit;
            text-decoration: none;
            margin: 0 8px;
            cursor: pointer;
            transition: color 0.3s;
        }
        .footer-links a:hover {
            color: rgba(26,26,26,0.5);
        }

        /* ─── Additional signup fields ─── */
        #signupFields .form-group:last-of-type {
            margin-bottom: 8px;
        }
        .skip-btn {
            background: transparent;
            border: 1px solid rgba(26,26,26,0.08);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 0.04em;
            color: rgba(26,26,26,0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 8px;
            white-space: nowrap;
            font-family: 'SF Pro Display', sans-serif;
            flex-shrink: 0;
        }
        .skip-btn:hover {
            border-color: rgba(26,26,26,0.2);
            color: #1a1a1a;
        }
        .id-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .id-wrapper .form-input {
            flex: 1;
        }

        /* ─── Glass Modal (unchanged) ─── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-box {
            background: rgba(20,20,20,0.8);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            max-width: 680px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            padding: 40px 36px;
            box-shadow: 0 32px 80px rgba(0,0,0,0.8);
            transform: translateY(-20px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }
        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.3);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
            font-family: inherit;
            line-height: 1;
        }
        .modal-close:hover {
            color: rgba(255,255,255,0.7);
        }
        .modal-box h1 {
            font-weight: 400;
            font-size: 26px;
            letter-spacing: 0.04em;
            color: #f2f2f2;
            margin-bottom: 4px;
        }
        .modal-box .sub {
            font-weight: 300;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 24px;
        }
        .modal-box h2 {
            font-weight: 400;
            font-size: 17px;
            letter-spacing: 0.03em;
            color: rgba(255,255,255,0.8);
            margin-top: 20px;
            margin-bottom: 8px;
        }
        .modal-box p,
        .modal-box li {
            font-weight: 300;
            font-size: 14px;
            line-height: 1.7;
            color: rgba(255,255,255,0.6);
            margin-bottom: 8px;
        }
        .modal-box ul {
            padding-left: 20px;
            margin-bottom: 12px;
        }
        .modal-box li { margin-bottom: 4px; }
        .modal-box hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.04);
            margin: 24px 0;
        }
        .modal-box .footer-note {
            font-size: 12px;
            color: rgba(255,255,255,0.15);
            text-align: center;
            margin-top: 24px;
        }
        .modal-box::-webkit-scrollbar {
            width: 4px;
        }
        .modal-box::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.02);
        }
        .modal-box::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
        }
        @media (max-width: 600px) {
            .modal-box {
                padding: 28px 20px;
                max-height: 90vh;
            }
            .modal-box h1 { font-size: 22px; }
        }

        /* ─── Responsive ─── */
        @media (max-width: 900px) {
            .split-screen {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 35vh;
                width: 100%;
            }
            .right-panel {
                flex: none;
                height: 65vh;
                padding: 32px 24px;
                width: 100%;
            }
            .form-container {
                max-width: 340px;
            }
            .social-buttons {
                flex-direction: column;
            }
        }
        @media (max-width: 500px) {
            .right-panel {
                padding: 24px 16px;
            }
            .form-title {
                font-size: 26px;
            }
            .form-sub {
                font-size: 13px;
            }
        }
    </style>
</head>

                `;
            } else if (type === 'terms') {
                title = 'Terms of Service';
                content = `

        function closeModal() {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        // ─── Original JS Logic ──────────────────────────────────────
        function hideTransition() {
            const overlay = document.getElementById('pageTransition');
            if (overlay) {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.style.display = 'none', 800);
            }
        }

        function loadBackground() {
            const panel = document.getElementById('leftPanel');
            if (typeof BG === 'string' && BG.startsWith('data:image')) {
                panel.style.backgroundImage = `url(${BG})`;
            } else {
                panel.style.backgroundImage = "url('abstract-dark-8k-ua.jpg')";
            }
        }

        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        storage: localStorage,
                        autoRefreshToken: true,
                        persistSession: true,
                    }
                });
            } else {
                console.error("❌ Keys are missing!");
            }
        } catch (e) {
            console.error('❌ Supabase init error:', e);
        }

        async function checkSessionAndRedirect() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                console.log("✅ Session found, redirecting to dashboard.");
                window.location.href = '/dashboard';
                return;
            }

            console.log("⏳ No immediate session, waiting 200ms for possible restore...");
            await new Promise(resolve => setTimeout(resolve, 200));
            const { data: { session: session2 } } = await supabaseClient.auth.getSession();
            if (session2) {
                console.log("✅ Session restored, redirecting to dashboard.");
                window.location.href = '/dashboard';
            } else {
                console.log("🚫 No session, showing login form.");
                document.getElementById('splitScreen').classList.add('visible');
                document.getElementById('loadingOverlay').classList.add('hidden');
                hideTransition();
            }
        }

        const mainBtn = document.getElementById('mainBtn');
        const btnText = document.getElementById('btnText');
        const signupFields = document.getElementById('signupFields');
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');
        const idInput = document.getElementById('idInput');
        const skipIdBtn = document.getElementById('skipIdBtn');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const errorMsg = document.getElementById('errorMsg');
        const toggleBtn = document.getElementById('toggleBtn');
        const formTitle = document.getElementById('formTitle');
        const formSub = document.getElementById('formSub');

        let isSigningUp = false;

        skipIdBtn.addEventListener('click', function(e) {
            e.preventDefault();
            idInput.value = 'Skipped';
            idInput.disabled = true;
            skipIdBtn.style.display = 'none';
        });

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            isSigningUp = !isSigningUp;
            errorMsg.classList.remove('visible');

            if (isSigningUp) {
                formTitle.innerText = 'Create an account.';
                formSub.innerText = 'Enter the House.';
                btnText.innerText = 'Sign Up';
                signupFields.style.display = 'block';
                toggleBtn.innerHTML = 'Already have an account? <strong>Sign In</strong>';
            } else {
                formTitle.innerText = 'Welcome back.';
                formSub.innerText = 'Your work, your team, your flow — all in one place.';
                btnText.innerText = 'Sign in with email';
                signupFields.style.display = 'none';
                toggleBtn.innerHTML = 'Don\'t have an account? <strong>Sign Up</strong>';
            }
        });

        mainBtn.addEventListener('click', async function() {
            if (!supabaseClient) {
                errorMsg.innerText = 'Database connection error.';
                errorMsg.classList.add('visible');
                return;
            }

            const email = emailInput.value.trim();
            const password = passInput.value.trim();
            errorMsg.classList.remove('visible');

            if (!email || !password) {
                errorMsg.innerText = 'Please fill in all fields.';
                errorMsg.classList.add('visible');
                return;
            }

            this.classList.add('loading');

            if (isSigningUp) {
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                const id_verified = idInput.value.trim() || 'pending';

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: name }
                    }
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.classList.add('visible');
                } else {
                    const { data: idData, error: idError } = await supabaseClient.rpc('generate_barvassi_id');
                    if (idError) {
                        console.error("ID generation failed:", idError);
                        errorMsg.innerText = 'Could not generate account ID.';
                        errorMsg.classList.add('visible');
                        return;
                    }
                    const accountId = idData;

                    const { error: insertError } = await supabaseClient.from('clients').insert([{
                        id: data.user.id,
                        full_name: name,
                        email: email,
                        phone: phone,
                        id_verified: id_verified,
                        account_id: accountId,
                        verification_status: 'unverified',
                        subscription_status: 'none'
                    }]);

                    if (insertError) {
                        console.error("Insert error:", insertError);
                        errorMsg.innerText = "Account created, but couldn't save extra data.";
                        errorMsg.classList.add('visible');
                    } else {
                        alert('Account created successfully!');
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1000);
                    }
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = 'Invalid credentials.';
                    errorMsg.classList.add('visible');
                } else {
                    window.location.href = '/dashboard';
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') mainBtn.click();
        });

        // Load background image (left panel)
        loadBackground();
        // Check session and show form if needed
        checkSessionAndRedirect();
    </script>
