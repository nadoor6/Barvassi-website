<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Test Entry</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        
        .split-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        .left-panel {
            flex: 2.5;
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
            background-image: url('abstract-dark-8k-ua.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.6);
            z-index: 1;
            pointer-events: none;
        }
        
        .left-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 60px;
            text-align: center;
            color: #fafafa;
        }
        
        .left-logo {
            max-width: 45%;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.3));
        }
        
        .left-whisper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 2px;
            color: #fafafa;
            opacity: 0.06;
        }
        
        .right-panel {
            flex: 1.5;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            position: relative;
        }
        
        .form-container {
            width: 100%;
            max-width: 280px;
            text-align: left;
        }
        
        .form-title {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            font-size: clamp(24px, 4vw, 36px);
            letter-spacing: -0.02em;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        
        .form-sub {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: rgba(26, 26, 26, 0.4);
            letter-spacing: 0.05em;
            margin-bottom: 28px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.5);
            margin-bottom: 4px;
        }
        
        .form-input {
            width: 100%;
            background: rgba(26, 26, 26, 0.04);
            border: 1px solid rgba(26, 26, 26, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .form-input::placeholder {
            color: rgba(26, 26, 26, 0.15);
        }
        
        .form-input:focus {
            border-color: rgba(26, 26, 26, 0.15);
            background: rgba(26, 26, 26, 0.06);
            box-shadow: 0 0 30px rgba(26, 26, 26, 0.02);
        }
        
        .signin-btn {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 9999px;
            padding: 14px 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
        }
        
        .signin-btn:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        
        .signin-btn:active {
            transform: scale(0.96);
            transition-duration: 0.2s;
        }
        
        .signin-btn.loading {
            pointer-events: none;
            background: #1a1a1a;
            transform: scale(1);
        }
        
        .signin-btn .btn-text {
            transition: opacity 0.4s ease;
        }
        
        .signin-btn.loading .btn-text {
            opacity: 0;
        }
        
        .signin-btn .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            width: 22px;
            height: 22px;
        }
        
        .signin-btn.loading .spinner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .spinner svg {
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .lost-link {
            display: block;
            text-align: right;
            margin-top: 12px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 11px;
            color: rgba(26, 26, 26, 0.3);
            text-decoration: none;
            transition: color 0.7s ease;
        }
        
        .lost-link:hover {
            color: rgba(26, 26, 26, 0.6);
        }
        
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 10px;
            color: rgba(26, 26, 26, 0.15);
            letter-spacing: 0.1em;
        }
        
        .right-bottom {
            position: absolute;
            bottom: 28px;
            right: 28px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 8px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.08);
        }
        
        .error-msg {
            text-align: center;
            font-size: 11px;
            color: rgba(180, 40, 40, 0.7);
            margin-top: 10px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .error-msg.visible {
            opacity: 1;
        }
        
        @media (max-width: 900px) {
            .split-screen {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 40vh;
                min-height: 200px;
                width: 100%;
            }
            .right-panel {
                flex: none;
                height: 60vh;
                padding: 40px 24px;
                width: 100%;
            }
            .form-container {
                max-width: 300px;
            }
            .left-content {
                padding: 30px;
            }
            .left-whisper {
                bottom: 20px;
                left: 20px;
                font-size: 9px;
            }
            .right-bottom {
                bottom: 20px;
                right: 20px;
                font-size: 7px;
            }
            .left-logo {
                max-width: 55%;
                max-height: 80px;
            }
        }
        
        @media (max-width: 480px) {
            .left-panel {
                height: 30vh;
                min-height: 150px;
            }
            .right-panel {
                height: 70vh;
                padding: 30px 16px;
            }
            .form-container {
                max-width: 100%;
            }
            .signin-btn {
                font-size: 10px;
                padding: 12px 0;
                height: 44px;
            }
            .signin-btn .spinner {
                width: 18px;
                height: 18px;
            }
            .left-logo {
                max-width: 50%;
                max-height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="split-screen">
        <!-- ===== LEFT PANEL ===== -->
        <div class="left-panel">
            <div class="video-overlay"></div>
            <div class="left-content">
                <img src="logo.png" alt="Barvassi" class="left-logo" />
            </div>
            <div class="left-whisper">بارڤاسي</div>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <div class="right-panel">
            <div class="form-container">
                <div class="form-title">Welcome back.</div>
                <div class="form-sub">Enter the vault.</div>

                <div class="form-group">
                    <label class="form-label">Username or Email Address</label>
                    <input type="text" class="form-input" id="test-username" placeholder="name@domain.com" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="test-password" placeholder="••••••••" autocomplete="off" />
                </div>

                <button class="signin-btn" id="test-signin-btn">
                    <span class="btn-text">Sign In Here</span>
                    <div class="spinner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" />
                        </svg>
                    </div>
                </button>

                <div class="error-msg" id="test-error-msg">Invalid credentials. Try again.</div>

                <a href="#" class="lost-link">Lost your password?</a>

                <div class="form-footer">Barvassi · Test Mode</div>
            </div>
            <div class="right-bottom">© 2026</div>
        </div>
    </div>

    <script>
        // ===== SIGN IN BUTTON + LOADING STATE =====
        const signinBtn = document.getElementById('test-signin-btn');
        const usernameInput = document.getElementById('test-username');
        const passwordInput = document.getElementById('test-password');
        const errorMsg = document.getElementById('test-error-msg');

        const TEST_CREDENTIALS = {
            username: 'barvassi',
            email: 'barvassi@domain.com',
            password: 'XVIII'
        };

        let isProcessing = false;

        signinBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (isProcessing) return;

            // Hide any previous error
            errorMsg.classList.remove('visible');

            // Trigger loading state
            isProcessing = true;
            this.classList.add('loading');

            // Wait 3 seconds
            setTimeout(() => {
                const enteredUser = usernameInput.value.trim().toLowerCase();
                const enteredPass = passwordInput.value.trim();

                const isValid = (
                    (enteredUser === TEST_CREDENTIALS.username.toLowerCase() || enteredUser === TEST_CREDENTIALS.email.toLowerCase()) &&
                    enteredPass === TEST_CREDENTIALS.password
                );

                // Remove loading state
                this.classList.remove('loading');
                isProcessing = false;

                if (isValid) {
                    // Redirect to dashboard
                    window.location.href = 'test-dashboard.html';
                } else {
                    errorMsg.classList.add('visible');
                    // Subtle shake hint on button
                    this.style.border = '1px solid rgba(180, 40, 40, 0.2)';
                    setTimeout(() => {
                        this.style.border = '';
                    }, 800);
                }
            }, 3000);
        });

        // Enter key support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                signinBtn.click();
            }
        });

        // Clear error on typing
        usernameInput.addEventListener('input', function() {
            errorMsg.classList.remove('visible');
        });
        passwordInput.addEventListener('input', function() {
            errorMsg.classList.remove('visible');
        });

        // Lost password link placeholder
        document.querySelector('.lost-link').addEventListener('click', function(e) {
            e.preventDefault();
            alert('A key will be sent to the registered address.');
        });
    </script>
</body>

</html>
