<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Enter the Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <!-- Load your keys first -->
    <script src="config.js"></script>
    <!-- Load Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }
        
        .split-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        
        .left-panel {
            flex: 2.5;
            position: relative;
            overflow: hidden;
            background-image: url('abstract-dark-8k-ua.jpg');
            background-size: cover;
            background-position: center;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.55);
            z-index: 1;
            pointer-events: none;
        }
        
        .left-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
        }
        
        .left-logo {
            max-width: 50%;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
        }
        
        .right-panel {
            flex: 1.5;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            position: relative;
        }
        
        .form-container {
            width: 100%;
            max-width: 280px;
            text-align: left;
        }
        
        .form-title {
            font-weight: 500;
            font-size: clamp(28px, 4vw, 40px);
            letter-spacing: -0.02em;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        
        .form-sub {
            font-weight: 300;
            font-size: 14px;
            color: rgba(26, 26, 26, 0.4);
            margin-bottom: 32px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.5);
            margin-bottom: 6px;
        }
        
        .form-input {
            width: 100%;
            background: rgba(26, 26, 26, 0.04);
            border: 1px solid rgba(26, 26, 26, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.5s ease;
        }
        
        .form-input:focus {
            border-color: rgba(26, 26, 26, 0.2);
            background: rgba(26, 26, 26, 0.06);
        }
        
        .signin-btn {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 14px 0;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 8px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .signin-btn:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        
        .signin-btn:active {
            transform: scale(0.96);
        }
        
        .signin-btn.loading {
            pointer-events: none;
            transform: scale(1);
        }
        
        .signin-btn .btn-text {
            transition: opacity 0.4s ease;
        }
        
        .signin-btn.loading .btn-text {
            opacity: 0;
        }
        
        .signin-btn .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            width: 22px;
            height: 22px;
        }
        
        .signin-btn.loading .spinner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .spinner svg {
            animation: spin 0.9s linear infinite;
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        
        .error-msg {
            text-align: center;
            font-size: 11px;
            color: rgba(180, 40, 40, 0.7);
            margin-top: 12px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        
        .error-msg.visible {
            opacity: 1;
        }
        
        .toggle-text {
            text-align: center;
            margin-top: 16px;
            font-weight: 300;
            font-size: 12px;
            color: rgba(26, 26, 26, 0.4);
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .toggle-text:hover {
            color: rgba(26, 26, 26, 0.7);
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
            font-weight: 300;
            font-size: 10px;
            color: rgba(26, 26, 26, 0.15);
            letter-spacing: 0.1em;
        }
        
        .right-bottom {
            position: absolute;
            bottom: 28px;
            right: 28px;
            font-weight: 300;
            font-size: 8px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.08);
        }
        
        @media (max-width: 900px) {
            .split-screen {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 35vh;
                width: 100%;
            }
            .right-panel {
                flex: none;
                height: 65vh;
                padding: 40px 24px;
                width: 100%;
            }
            .form-container {
                max-width: 300px;
            }
        }
    </style>
</head>

<body>
    <div class="split-screen">
        <div class="left-panel">
            <div class="overlay"></div>
            <div class="left-content">
                <img src="logo.png" alt="Barvassi" class="left-logo" />
            </div>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <div class="form-title" id="formTitle">Welcome back.</div>
                <div class="form-sub" id="formSub">Enter the vault.</div>

                <div class="form-group" id="nameGroup" style="display:none;">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-input" id="nameInput" placeholder="Your name" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="name@domain.com" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="passInput" placeholder="••••••••" autocomplete="off" />
                </div>

                <button class="signin-btn" id="mainBtn">
                    <span class="btn-text" id="btnText">Sign In Here</span>
                    <div class="spinner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" />
                        </svg>
                    </div>
                </button>

                <div class="error-msg" id="errorMsg">Error message here</div>
                <div class="toggle-text" id="toggleBtn">Don't have an account? Sign Up</div>
                <div class="footer">Barvassi</div>
            </div>
            <div class="right-bottom">© 2026</div>
        </div>
    </div>

    <script>
        // Connect to your database using the keys from config.js
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- BUTTONS & LOGIC ---
        const mainBtn = document.getElementById('mainBtn');
        const btnText = document.getElementById('btnText');
        const nameGroup = document.getElementById('nameGroup');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const errorMsg = document.getElementById('errorMsg');
        const toggleBtn = document.getElementById('toggleBtn');
        const formTitle = document.getElementById('formTitle');
        const formSub = document.getElementById('formSub');

        let isSigningUp = false;

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            isSigningUp = !isSigningUp;
            errorMsg.classList.remove('visible');

            if (isSigningUp) {
                formTitle.innerText = 'Create an account.';
                formSub.innerText = 'Enter the House.';
                btnText.innerText = 'Sign Up';
                nameGroup.style.display = 'block';
                toggleBtn.innerText = 'Already have an account? Sign In';
            } else {
                formTitle.innerText = 'Welcome back.';
                formSub.innerText = 'Enter the vault.';
                btnText.innerText = 'Sign In Here';
                nameGroup.style.display = 'none';
                toggleBtn.innerText = "Don't have an account? Sign Up";
            }
        });

        mainBtn.addEventListener('click', async function() {
            const email = emailInput.value.trim();
            const password = passInput.value.trim();
            errorMsg.classList.remove('visible');

            if (!email || !password) {
                errorMsg.innerText = 'Please fill in all fields.';
                errorMsg.classList.add('visible');
                return;
            }

            this.classList.add('loading');

            if (isSigningUp) {
                const name = nameInput.value.trim();
                const {
                    data,
                    error
                } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name
                        }
                    }
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.classList.add('visible');
                } else {
                    // Save to database
                    await supabase.from('clients').insert([{
                        id: data.user.id,
                        full_name: name,
                        email: email
                    }]);
                    alert('Account created! Check your email to verify.');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
            } else {
                const {
                    error
                } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = 'Invalid credentials.';
                    errorMsg.classList.add('visible');
                } else {
                    window.location.href = 'dashboard.html';
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') mainBtn.click();
        });
    </script>
</body>

</html>
