<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi — Visual Identity</title>
    <style>
        /* ── reset ── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── base ── */
        html,
        body {
            height: 100%;
            font-family: -apple-system, 'SF Pro Display', 'SF Pro Text',
                'Helvetica Neue', system-ui, sans-serif;
            background-color: #0c0c0c;
            color: #f2f2f2;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── center everything ── */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            text-align: center;
        }

        /* ── main container ── */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.75rem;
            max-width: 48rem;
            width: 100%;
        }

        /* ── logo ── */
        .logo {
            display: block;
            width: auto;
            height: auto;
            max-width: 220px;
            /* adjust to your logo's natural proportions */
            max-height: 80px;
            object-fit: contain;
            filter: brightness(0) invert(1);
            /* ensures logo is white on dark bg */
        }

        /* if your logo file is already light, remove the filter above */
        /* if it's dark, keep it — it will render #f2f2f2 */

        /* ── tagline ── */
        .tagline {
            font-family: -apple-system, 'SF Pro Display', 'SF Pro Text',
                'Helvetica Neue', system-ui, sans-serif;
            font-weight: 400;
            font-size: clamp(1.25rem, 4vw, 2rem);
            letter-spacing: 0.04em;
            line-height: 1.4;
            color: #f2f2f2;
            max-width: 36rem;
            margin: 0 auto;
        }

        /* ── button ── */
        .btn {
            display: inline-block;
            background-color: #f2f2f2;
            color: #0c0c0c;
            font-family: -apple-system, 'SF Pro Display', 'SF Pro Text',
                'Helvetica Neue', system-ui, sans-serif;
            font-weight: 500;
            font-size: clamp(0.95rem, 1.4vw, 1.15rem);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            padding: 0.9rem 3.2rem;
            border-radius: 0;
            /* sharp, luxury minimalism */
            border: none;
            cursor: pointer;
            transition: background-color 0.25s ease, color 0.25s ease,
                box-shadow 0.25s ease;
            box-shadow: 0 0 0 0 rgba(242, 242, 242, 0);
        }

        .btn:hover {
            background-color: #d9d9d9;
            /* slightly lighter than #f2f2f2 */
            color: #0c0c0c;
            box-shadow: 0 0 0 1px #f2f2f2;
        }

        .btn:focus-visible {
            outline: 2px solid #f2f2f2;
            outline-offset: 4px;
        }

        /* ── spacing for very small screens ── */
        @media (max-width: 480px) {
            .container {
                gap: 2rem;
            }
            .logo {
                max-width: 160px;
                max-height: 60px;
            }
            .btn {
                padding: 0.8rem 2.4rem;
            }
        }

        /* ── reduce motion if preferred ── */
        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. LOGO -->
        <img
        class="logo"
        src="logo.png"
        alt="Barvassi"
        width="220"
        height="80"
        />

        <!-- 2. TAGLINE -->
        <p class="tagline">
            Visual Identity for brands that seek eternity.
        </p>

        <!-- 3. BUTTON → email -->
        <a
        class="btn"
        href="mailto:contact@barvassi.com"
        aria-label="Send an email to Barvassi"
        >
        Let's build
        </a>

    </div>

</body>
</html>
