<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Clé Dixhuit</title>
    <style>
        /* ===== RESET & BASE ===== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #1a1a1a;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }
        /* ===== SPLIT SCREEN (2.5/4 : 1.5/4) ===== */
        
        .split-screen {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        /* ===== LEFT PANEL (Video) ===== */
        
        .left-panel {
            flex: 2.5;
            /* 62.5% width */
            position: relative;
            overflow: hidden;
            background: #0a0a0a;
        }
        
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.01) translateZ(0);
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            backface-visibility: hidden;
            will-change: transform;
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.6);
            z-index: 1;
            pointer-events: none;
        }
        /* ===== LEFT PANEL CONTENT ===== */
        
        .left-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 60px;
            text-align: center;
            color: #fafafa;
        }
        
        .left-logo {
            max-width: 45%;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
            filter: drop-shadow(0 0 30px rgba(0, 0, 0, 0.3));
        }
        
        .left-whisper {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-weight: 300;
            font-size: 11px;
            letter-spacing: 2px;
            color: #fafafa;
            opacity: 0.06;
        }
        /* ===== RIGHT PANEL (Form) ===== */
        
        .right-panel {
            flex: 1.5;
            /* 37.5% width */
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            position: relative;
        }
        
        .form-container {
            width: 100%;
            max-width: 280px;
            text-align: left;
        }
        
        .form-title {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            font-size: clamp(24px, 4vw, 36px);
            letter-spacing: -0.02em;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        
        .form-sub {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: rgba(26, 26, 26, 0.4);
            letter-spacing: 0.05em;
            margin-bottom: 28px;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-label {
            display: block;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.5);
            margin-bottom: 4px;
        }
        
        .form-input {
            width: 100%;
            background: rgba(26, 26, 26, 0.04);
            border: 1px solid rgba(26, 26, 26, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 13px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .form-input::placeholder {
            color: rgba(26, 26, 26, 0.15);
        }
        
        .form-input:focus {
            border-color: rgba(26, 26, 26, 0.15);
            background: rgba(26, 26, 26, 0.06);
            box-shadow: 0 0 30px rgba(26, 26, 26, 0.02);
        }
        
        .signin-btn {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 9999px;
            padding: 14px 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
            margin-top: 4px;
        }
        
        .signin-btn:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        
        .signin-btn:active {
            transform: scale(0.96);
            transition-duration: 0.2s;
        }
        
        .lost-link {
            display: block;
            text-align: right;
            margin-top: 12px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 11px;
            color: rgba(26, 26, 26, 0.3);
            text-decoration: none;
            transition: color 0.7s ease;
        }
        
        .lost-link:hover {
            color: rgba(26, 26, 26, 0.6);
        }
        
        .form-footer {
            text-align: center;
            margin-top: 20px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 10px;
            color: rgba(26, 26, 26, 0.15);
            letter-spacing: 0.1em;
        }
        
        .right-bottom {
            position: absolute;
            bottom: 28px;
            right: 28px;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 300;
            font-size: 8px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.08);
        }
        /* ===== RESPONSIVE ===== */
        
        @media (max-width: 900px) {
            .split-screen {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 40vh;
                min-height: 200px;
                width: 100%;
            }
            .right-panel {
                flex: none;
                height: 60vh;
                padding: 40px 24px;
                width: 100%;
            }
            .form-container {
                max-width: 300px;
            }
            .left-content {
                padding: 30px;
            }
            .left-whisper {
                bottom: 20px;
                left: 20px;
                font-size: 9px;
            }
            .right-bottom {
                bottom: 20px;
                right: 20px;
                font-size: 7px;
            }
            .left-logo {
                max-width: 55%;
                max-height: 80px;
            }
        }
        
        @media (max-width: 480px) {
            .left-panel {
                height: 30vh;
                min-height: 150px;
            }
            .right-panel {
                height: 70vh;
                padding: 30px 16px;
            }
            .form-container {
                max-width: 100%;
            }
            .signin-btn {
                font-size: 10px;
                padding: 12px 0;
            }
            .left-logo {
                max-width: 50%;
                max-height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="split-screen">

        <!-- ===== LEFT PANEL (VIDEO - 62.5%) ===== -->
        <div class="left-panel">
            <video id="bg-video" autoplay loop muted playsinline preload="metadata">
                <source src="bgloopvideo.mp4" type="video/mp4" />
            </video>
            <div class="video-overlay"></div>
            <div class="left-content">
                <img src="logo.png" alt="Barvassi" class="left-logo" />
            </div>
            <div class="left-whisper">بارڤاسي</div>
        </div>

        <!-- ===== RIGHT PANEL (FORM - 37.5%) ===== -->
        <div class="right-panel">
            <div class="form-container">
                <div class="form-title">Welcome back.</div>
                <div class="form-sub">Enter the vault.</div>

                <div class="form-group">
                    <label class="form-label">Username or Email Address</label>
                    <input type="text" class="form-input" placeholder="name@domain.com" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" placeholder="••••••••" autocomplete="off" />
                </div>

                <button class="signin-btn">Sign In Here</button>
                <a href="#" class="lost-link">Lost your password?</a>

                <div class="form-footer">Barvassi</div>
            </div>
            <div class="right-bottom">© 2026</div>
        </div>

    </div>

    <!-- ===== INTERACTIONS ===== -->
    <script>
        // ===== VIDEO PLAYBACK =====
        (function() {
            const video = document.getElementById('bg-video');
            video.play().catch(() => {
                const startVideo = () => {
                    video.play().catch(() => {});
                    document.removeEventListener('click', startVideo);
                    document.removeEventListener('touchstart', startVideo);
                };
                document.addEventListener('click', startVideo);
                document.addEventListener('touchstart', startVideo);
            });
        })();

        // ===== SIGN IN BUTTON =====
        const signinBtn = document.querySelector('.signin-btn');
        signinBtn.addEventListener('click', function() {
            this.style.transform = 'scale(0.96)';
            setTimeout(() => {
                this.style.transform = '';
            }, 200);
        });
    </script>

</body>

</html>
