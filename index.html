<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─── SEO & Brand Identity ─── -->
    <title>Barvassi – The Vault · Ultra‑Luxury Brand by Nader</title>
    <meta name="description" content="Barvassi is an ultra‑luxury brand founded by Nader (18, Aleppo). Experience the silent vault of cold minimalism and timeless elegance." />
    <meta name="keywords" content="Barvassi, luxury brand, Nader, Aleppo, vault, minimalism, cold marble, dark romantic" />
    <meta name="author" content="Nader" />
    <link rel="canonical" href="https://barvassi.com/" />

    <!-- ─── Open Graph (Social Sharing) ─── -->
    <meta property="og:title" content="Barvassi – The Vault" />
    <meta property="og:description" content="Ultra‑luxury brand founded by Nader (18, Aleppo). Enter the silent vault of cold minimalism." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://barvassi.com/" />
    <meta property="og:image" content="https://barvassi.com/apple-touch-icon.png" />
    <meta property="og:image:width" content="180" />
    <meta property="og:image:height" content="180" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Barvassi – The Vault" />
    <meta name="twitter:description" content="Ultra‑luxury brand founded by Nader (18, Aleppo)." />

    <!-- ─── JSON‑LD Structured Data ─── -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "Barvassi",
            "description": "Ultra‑luxury brand founded by Nader, offering a silent vault experience of cold minimalism.",
            "url": "https://barvassi.com",
            "logo": "https://barvassi.com/apple-touch-icon.png",
            "founder": {
                "@type": "Person",
                "name": "Nader",
                "age": "18",
                "birthPlace": "Aleppo",
                "nationality": "Syrian",
                "jobTitle": "Founder & Creative Director",
                "url": "https://barvassi.com"
            },
            "foundingDate": "2026",
            "address": {
                "@type": "PostalAddress",
                "addressLocality": "Aleppo",
                "addressCountry": "SY"
            }
        }
    </script>

    <!-- ─── Existing Fonts & Scripts ─── -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="logo.js"></script>
    <script src="loginBG.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* ─── all existing styles remain unchanged ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #1a1a1a;
            height: 100vh;
            overflow: hidden;
        }

        .page-transition {
            position: fixed;
            inset: 0;
            background: #0c0c0c;
            z-index: 9999;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .page-transition.hidden {
            opacity: 0;
        }

        .split-screen {
            display: none;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
        }
        .split-screen.visible {
            display: flex;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0c0c0c;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .loading-spinner {
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #fafafa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .left-panel {
            flex: 2.5;
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.55);
            z-index: 1;
            pointer-events: none;
        }
        .left-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 40px;
        }
        .left-logo {
            max-width: 45%;
            max-height: 120px;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0.9;
        }
        .left-logo-fallback {
            display: none;
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            font-size: 48px;
            font-weight: 400;
            color: #fafafa;
            opacity: 0.8;
            letter-spacing: 0.15em;
        }

        .right-panel {
            flex: 1.5;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 32px;
            position: relative;
        }
        .form-container {
            width: 100%;
            max-width: 280px;
            text-align: left;
        }

        /* Changed to h1 for SEO */
        .form-title {
            font-weight: 500;
            font-size: clamp(28px, 4vw, 40px);
            letter-spacing: -0.02em;
            color: #1a1a1a;
            line-height: 1.1;
            margin-bottom: 4px;
        }
        .form-sub {
            font-weight: 300;
            font-size: 14px;
            color: rgba(26, 26, 26, 0.4);
            margin-bottom: 32px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-label {
            display: block;
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.5);
            margin-bottom: 6px;
        }
        .form-input {
            width: 100%;
            background: rgba(26, 26, 26, 0.04);
            border: 1px solid rgba(26, 26, 26, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 14px;
            color: #1a1a1a;
            outline: none;
            transition: all 0.5s ease;
        }
        .form-input:focus {
            border-color: rgba(26, 26, 26, 0.2);
            background: rgba(26, 26, 26, 0.06);
        }

        .btn1 {
            width: 100%;
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 14px 0;
            font-weight: 400;
            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 8px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .btn1:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .btn1:active {
            transform: scale(0.96);
        }
        .btn1.loading {
            pointer-events: none;
            background: #2a2a2a;
            transform: scale(1);
        }
        .btn1 .btn-text {
            transition: opacity 0.4s ease;
        }
        .btn1.loading .btn-text {
            opacity: 0;
        }
        .btn1 .spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.4s ease;
            width: 22px;
            height: 22px;
        }
        .btn1.loading .spinner {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .spinner svg {
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .error-msg {
            text-align: center;
            font-size: 11px;
            color: rgba(180, 40, 40, 0.7);
            margin-top: 12px;
            height: 18px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .error-msg.visible {
            opacity: 1;
        }

        .toggle-text {
            text-align: center;
            margin-top: 16px;
            font-weight: 300;
            font-size: 12px;
            color: rgba(26, 26, 26, 0.4);
            cursor: pointer;
            transition: color 0.3s;
        }
        .toggle-text:hover {
            color: rgba(26, 26, 26, 0.7);
        }

        .skip-btn {
            background: transparent;
            border: 1px solid rgba(26, 26, 26, 0.06);
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 10px;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: rgba(26, 26, 26, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-left: 8px;
            white-space: nowrap;
            font-family: 'SF Pro Display', sans-serif;
        }
        .skip-btn:hover {
            border-color: rgba(26, 26, 26, 0.3);
            color: #1a1a1a;
        }

        .copyright-footer {
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(26, 26, 26, 0.15);
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(26, 26, 26, 0.04);
            width: 100%;
        }

        @media (max-width: 900px) {
            .split-screen {
                flex-direction: column;
            }
            .left-panel {
                flex: none;
                height: 35vh;
                width: 100%;
            }
            .right-panel {
                flex: none;
                height: 65vh;
                padding: 40px 24px;
                width: 100%;
            }
            .form-container {
                max-width: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- ─── Page Transition Overlay ─── -->
    <div class="page-transition" id="pageTransition"></div>

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <div class="split-screen" id="splitScreen">
        <div class="left-panel" id="leftPanel">
            <div class="overlay"></div>
            <div class="left-content">
                <img id="leftLogo" src="" alt="Barvassi – Ultra‑Luxury Brand" class="left-logo" />
                <div id="logoFallback" class="left-logo-fallback">Barvassi</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="form-container">
                <!-- Changed to <h1> for SEO -->
                <h1 class="form-title" id="formTitle">Welcome back.</h1>
                <div class="form-sub" id="formSub">Enter the vault.</div>

                <div id="signupFields" style="display:none;">
                    <div class="form-group">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-input" id="nameInput" placeholder="Your name" autocomplete="off" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-input" id="phoneInput" placeholder="+963 99 123 4567" autocomplete="off" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">ID / Passport Number (Optional)</label>
                        <div style="display:flex; align-items:center;">
                            <input type="text" class="form-input" id="idInput" placeholder="Type your ID or Passport #" autocomplete="off" style="flex:1;" />
                            <button class="skip-btn" id="skipIdBtn">Skip</button>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-input" id="emailInput" placeholder="name@domain.com" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-input" id="passInput" placeholder="••••••••" autocomplete="off" />
                </div>

                <button class="btn1" id="mainBtn">
                    <span class="btn-text" id="btnText">Sign In Here</span>
                    <div class="spinner">
                        <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" stroke-opacity="0.2" />
                            <path d="M12 2a10 10 0 0 1 10 10" stroke-opacity="1" />
                        </svg>
                    </div>
                </button>

                <div class="error-msg" id="errorMsg"></div>
                <div class="toggle-text" id="toggleBtn">Don't have an account? Sign Up</div>
                <div class="copyright-footer">© 2026 Barvassi. All rights reserved.</div>
                <div style="margin-top: 12px; text-align: center; font-size: 9px; letter-spacing: 0.1em; color: rgba(26,26,26,0.15);">
    <a href="/privacy" style="color: inherit; text-decoration: none; margin: 0 6px;">Privacy</a>
    <span style="opacity:0.2;">·</span>
    <a href="/terms" style="color: inherit; text-decoration: none; margin: 0 6px;">Terms</a>
</div>
            </div>
        </div>
    </div>

    <script>
        // ─── all existing JavaScript remains exactly the same ───
        console.log("🚀 Index page loaded");

        function hideTransition() {
            const overlay = document.getElementById('pageTransition');
            if (overlay) {
                overlay.classList.add('hidden');
                setTimeout(() => overlay.style.display = 'none', 800);
            }
        }

        function loadLogo() {
            const logoEl = document.getElementById('leftLogo');
            const fallback = document.getElementById('logoFallback');
            if (typeof BARVASSI_LOGO === 'string' && BARVASSI_LOGO.startsWith('data:image')) {
                logoEl.src = BARVASSI_LOGO;
                logoEl.style.display = 'block';
                fallback.style.display = 'none';
            } else {
                logoEl.style.display = 'none';
                fallback.style.display = 'block';
            }
        }

        function loadBackground() {
            const panel = document.getElementById('leftPanel');
            if (typeof BG === 'string' && BG.startsWith('data:image')) {
                panel.style.backgroundImage = `url(${BG})`;
            } else {
                panel.style.backgroundImage = "url('abstract-dark-8k-ua.jpg')";
            }
        }

        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        storage: localStorage,
                        autoRefreshToken: true,
                        persistSession: true,
                    }
                });
            } else {
                console.error("❌ Keys are missing!");
            }
        } catch (e) {
            console.error('❌ Supabase init error:', e);
        }

        async function checkSessionAndRedirect() {
            if (!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                console.log("✅ Session found, redirecting to dashboard.");
                window.location.href = '/dashboard';
                return;
            }

            console.log("⏳ No immediate session, waiting 200ms for possible restore...");
            await new Promise(resolve => setTimeout(resolve, 200));
            const { data: { session: session2 } } = await supabaseClient.auth.getSession();
            if (session2) {
                console.log("✅ Session restored, redirecting to dashboard.");
                window.location.href = '/dashboard';
            } else {
                console.log("🚫 No session, showing login form.");
                document.getElementById('splitScreen').classList.add('visible');
                document.getElementById('loadingOverlay').classList.add('hidden');
                hideTransition();
            }
        }

        const mainBtn = document.getElementById('mainBtn');
        const btnText = document.getElementById('btnText');
        const signupFields = document.getElementById('signupFields');
        const nameInput = document.getElementById('nameInput');
        const phoneInput = document.getElementById('phoneInput');
        const idInput = document.getElementById('idInput');
        const skipIdBtn = document.getElementById('skipIdBtn');
        const emailInput = document.getElementById('emailInput');
        const passInput = document.getElementById('passInput');
        const errorMsg = document.getElementById('errorMsg');
        const toggleBtn = document.getElementById('toggleBtn');
        const formTitle = document.getElementById('formTitle');
        const formSub = document.getElementById('formSub');

        let isSigningUp = false;

        skipIdBtn.addEventListener('click', function(e) {
            e.preventDefault();
            idInput.value = 'Skipped';
            idInput.disabled = true;
            skipIdBtn.style.display = 'none';
        });

        toggleBtn.addEventListener('click', function(e) {
            e.preventDefault();
            isSigningUp = !isSigningUp;
            errorMsg.classList.remove('visible');

            if (isSigningUp) {
                formTitle.innerText = 'Create an account.';
                formSub.innerText = 'Enter the House.';
                btnText.innerText = 'Sign Up';
                signupFields.style.display = 'block';
                toggleBtn.innerText = 'Already have an account? Sign In';
            } else {
                formTitle.innerText = 'Welcome back.';
                formSub.innerText = 'Enter the vault.';
                btnText.innerText = 'Sign In Here';
                signupFields.style.display = 'none';
                toggleBtn.innerText = "Don't have an account? Sign Up";
            }
        });

        mainBtn.addEventListener('click', async function() {
            if (!supabaseClient) {
                errorMsg.innerText = 'Database connection error.';
                errorMsg.classList.add('visible');
                return;
            }

            const email = emailInput.value.trim();
            const password = passInput.value.trim();
            errorMsg.classList.remove('visible');

            if (!email || !password) {
                errorMsg.innerText = 'Please fill in all fields.';
                errorMsg.classList.add('visible');
                return;
            }

            this.classList.add('loading');

            if (isSigningUp) {
                const name = nameInput.value.trim();
                const phone = phoneInput.value.trim();
                const id_verified = idInput.value.trim() || 'pending';

                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: name }
                    }
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = error.message;
                    errorMsg.classList.add('visible');
                } else {
                    const { data: idData, error: idError } = await supabaseClient.rpc('generate_barvassi_id');
                    if (idError) {
                        console.error("ID generation failed:", idError);
                        errorMsg.innerText = 'Could not generate account ID.';
                        errorMsg.classList.add('visible');
                        return;
                    }
                    const accountId = idData;

                    const { error: insertError } = await supabaseClient.from('clients').insert([{
                        id: data.user.id,
                        full_name: name,
                        email: email,
                        phone: phone,
                        id_verified: id_verified,
                        account_id: accountId,
                        verification_status: 'unverified',
                        subscription_status: 'none'
                    }]);

                    if (insertError) {
                        console.error("Insert error:", insertError);
                        errorMsg.innerText = "Account created, but couldn't save extra data.";
                        errorMsg.classList.add('visible');
                    } else {
                        alert('Account created successfully!');
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1000);
                    }
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                this.classList.remove('loading');

                if (error) {
                    errorMsg.innerText = 'Invalid credentials.';
                    errorMsg.classList.add('visible');
                } else {
                    window.location.href = '/dashboard';
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') mainBtn.click();
        });

        loadLogo();
        loadBackground();
        checkSessionAndRedirect();
    </script>
</body>

</html>
