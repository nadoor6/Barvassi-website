<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The House of Barvassi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0a;
            color: #fafafa;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* ===== VIDEO BACKGROUND ===== */
        
        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.01) translateZ(0);
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            backface-visibility: hidden;
            will-change: transform;
        }
        
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.55);
            z-index: 1;
            pointer-events: none;
        }
        /* ===== ARABIC WHISPER ===== */
        
        .arabic-whisper {
            position: fixed;
            top: 28px;
            left: 32px;
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #fafafa;
            opacity: 0.04;
            pointer-events: none;
            z-index: 3;
            font-family: 'SF Pro Display', sans-serif;
        }
        /* ===== MAIN APP ===== */
        
        .app {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 1200px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        /* ===== GLASS HEADER ===== */
        
        .glass-nav {
            margin-bottom: 40px;
            background: rgba(10, 10, 10, 0.2);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 9999px;
            padding: 14px 36px;
            transition: border-color 1.2s ease;
        }
        
        .glass-nav:hover {
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .logo-link {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #fafafa;
            text-decoration: none;
            opacity: 0.9;
            transition: opacity 1.2s ease;
        }
        
        .logo-link:hover {
            opacity: 0.5;
        }
        /* ===== MAIN TEXT ===== */
        
        .main-text {
            text-align: center;
            margin-bottom: 48px;
        }
        
        .headline {
            font-family: 'Playfair Display', serif;
            font-size: clamp(48px, 10vw, 100px);
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: #fafafa;
            margin-bottom: 8px;
        }
        
        .headline span {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }
        
        .sub-line {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 4px;
        }
        /* ===== ENTRY CONTAINER (MORPHING BUTTON) ===== */
        
        .entry-container {
            width: 100%;
            max-width: 260px;
            position: relative;
            height: 54px;
        }
        
        .entry-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* --- Button (initial state) --- */
        
        .entry-btn {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.06);
            color: #fafafa;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Inter', sans-serif;
            z-index: 2;
        }
        
        .entry-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }
        
        .entry-btn:active {
            transform: scale(0.96);
            transition-duration: 0.2s;
        }
        
        .entry-btn.hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* --- Input (morphed state) --- */
        
        .entry-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 10, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 9999px;
            padding: 0 24px;
            color: #fafafa;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 300;
            outline: none;
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .entry-input.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        
        .entry-input:focus {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.01);
        }
        
        .entry-input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }
        /* ===== FOOTER ===== */
        
        .footer {
            position: fixed;
            bottom: 28px;
            font-size: 8px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.04);
        }
        /* ===== RESPONSIVE ===== */
        
        @media (max-width: 600px) {
            .glass-nav {
                padding: 12px 24px;
                margin-bottom: 30px;
            }
            .logo-link {
                font-size: 18px;
            }
            .main-text {
                margin-bottom: 32px;
            }
            .headline {
                font-size: 32px;
            }
            .sub-line {
                font-size: 10px;
                letter-spacing: 0.2em;
            }
            .entry-container {
                max-width: 220px;
                height: 48px;
            }
            .entry-btn {
                font-size: 10px;
            }
            .entry-input {
                font-size: 13px;
                padding: 0 18px;
            }
            .arabic-whisper {
                font-size: 9px;
                top: 16px;
                left: 16px;
            }
            .footer {
                bottom: 16px;
                font-size: 6px;
            }
        }
        
        @media (max-width: 480px) {
            .entry-container {
                max-width: 200px;
                height: 44px;
            }
            .entry-btn {
                font-size: 9px;
            }
            .entry-input {
                font-size: 12px;
                padding: 0 14px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== VIDEO BACKGROUND ===== -->
    <video id="bg-video" autoplay loop muted playsinline preload="metadata">
        <source src="bgloopvideo.mp4" type="video/mp4" />
    </video>

    <!-- ===== DARK OVERLAY ===== -->
    <div class="video-overlay"></div>

    <!-- ===== ARABIC WHISPER ===== -->
    <div class="arabic-whisper">بارڤاسي</div>

    <!-- ===== MAIN APP ===== -->
    <div class="app">

        <!-- ===== GLASS HEADER ===== -->
        <nav class="glass-nav">
            <a href="#" class="logo-link">The House of Barvassi</a>
        </nav>

        <!-- ===== MAIN TEXT ===== -->
        <div class="main-text">
            <div class="headline">
                Silence. <br />
                <span>Stone. Shadow.</span>
            </div>
            <div class="sub-line">Clé Dixhuit</div>
        </div>

        <!-- ===== ENTRY CONTAINER (MORPHING BUTTON) ===== -->
        <div class="entry-container">
            <div class="entry-wrapper">
                <button class="entry-btn" id="entryBtn">Enter</button>
                <input type="text" class="entry-input" id="entryInput" placeholder="Key" autocomplete="off" />
            </div>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">© 2026</div>

    </div>

    <!-- ===== INTERACTIONS ===== -->
    <script>
        // ===== VIDEO PLAYBACK =====
        (function() {
            const video = document.getElementById('bg-video');
            video.play().catch(() => {
                const startVideo = () => {
                    video.play().catch(() => {});
                    document.removeEventListener('click', startVideo);
                    document.removeEventListener('touchstart', startVideo);
                };
                document.addEventListener('click', startVideo);
                document.addEventListener('touchstart', startVideo);
            });
        })();

        // ===== MORPHING BUTTON =====
        const entryBtn = document.getElementById('entryBtn');
        const entryInput = document.getElementById('entryInput');

        // Click "Enter" → morph into input
        entryBtn.addEventListener('click', function() {
            this.classList.add('hidden');
            entryInput.classList.add('visible');
            setTimeout(() => {
                entryInput.focus();
            }, 350);
        });

        // Escape key → revert to button
        entryInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.classList.remove('visible');
                entryBtn.classList.remove('hidden');
                this.value = '';
            }

            // Enter key → submit the key
            if (e.key === 'Enter') {
                const value = this.value.trim();
                if (value) {
                    // Subtle success glow
                    this.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                    this.style.boxShadow = '0 0 40px rgba(255, 255, 255, 0.02)';
                    setTimeout(() => {
                        this.style.borderColor = '';
                        this.style.boxShadow = '';
                        this.classList.remove('visible');
                        entryBtn.classList.remove('hidden');
                        this.value = '';
                    }, 900);
                }
            }
        });

        // Click outside → revert to button
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.entry-container') && entryInput.classList.contains('visible')) {
                entryInput.classList.remove('visible');
                entryBtn.classList.remove('hidden');
                entryInput.value = '';
            }
        });

        // ===== LOGO REFRESH =====
        document.querySelector('.logo-link').addEventListener('click', function(e) {
            e.preventDefault();
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>

</html>
