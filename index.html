<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi - by Nader</title>

    <!-- SF Pro Display via CDN -->
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />

    <style>
        /* ── Reset & Base ─────────────────────────────────────────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            /* no scroll */
            background: #0c0c0c;
            color: #f2f2f2;
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Fade‑in animation ────────────────────────────────────────── */
        body {
            animation: fadeIn 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* ── Main container ───────────────────────────────────────────── */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        /* ── Content column ───────────────────────────────────────────── */
        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        /* ── Logo image ───────────────────────────────────────────────── */
        .logo {
            display: block;
            max-width: min(70%, 260px);
            height: auto;
            margin-bottom: 2rem;
            /* generous space below logo */
        }

        /* ── Name wrapper (flex for inline badge) ────────────────────── */
        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
        }

        /* ── Nader (thin grotesk) ────────────────────────────────────── */
        .name {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 200;
            /* thin */
            font-size: clamp(1.125rem, 5vw, 1.5rem);
            /* 18px → 24px */
            letter-spacing: 0.04em;
            color: #f2f2f2;
            line-height: 1.2;
        }

        /* ── Verified badge ───────────────────────────────────────────── */
        .badge {
            height: 1.15em;
            /* scales with the name text */
            width: auto;
            display: inline-block;
            flex-shrink: 0;
        }

        /* ── Visual Identity Engineer (monospace) ────────────────────── */
        .title {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 400;
            font-size: clamp(0.625rem, 2.5vw, 0.75rem);
            /* 10px → 12px */
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #f2f2f2;
            margin-bottom: 2rem;
            /* spacing before the statement */
        }

        /* ── Statement (thin grotesk, italic) ────────────────────────── */
        .statement {
            font-family: 'SF Pro Display', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 200;
            /* thin */
            font-style: italic;
            font-size: clamp(0.75rem, 3vw, 0.875rem);
            /* 12px → 14px */
            letter-spacing: 0.02em;
            line-height: 1.6;
            color: #f2f2f2;
            max-width: 90%;
        }

        /* ── Footer (fixed bottom) ────────────────────────────────────── */
        .footer {
            position: fixed;
            bottom: 1.25rem;
            left: 0;
            right: 0;
            text-align: center;
            padding: 0 1rem;
            pointer-events: none;
            /* allows clicks to pass through */
        }

        .footer p {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 400;
            font-size: clamp(0.375rem, 1.6vw, 0.5rem);
            /* 6px → 8px */
            letter-spacing: 0.04em;
            color: #f2f2f2;
            opacity: 0.3;
            margin: 0;
            line-height: 1.4;
            white-space: nowrap;
        }

        /* ── Responsive fine‑tuning ───────────────────────────────────── */
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .logo {
                max-width: min(80%, 180px);
                margin-bottom: 1.5rem;
            }

            .title {
                letter-spacing: 0.2em;
                margin-bottom: 1.5rem;
            }

            .statement {
                max-width: 95%;
            }

            .footer p {
                white-space: normal;
                /* wrap on very small screens */
                padding: 0 0.5rem;
            }
        }

        @media (max-width: 360px) {
            .name {
                font-size: clamp(0.875rem, 4vw, 1.125rem);
            }
            .badge {
                height: 1.2em;
            }
            .title {
                font-size: clamp(0.5rem, 2vw, 0.625rem);
            }
            .statement {
                font-size: clamp(0.625rem, 2.8vw, 0.75rem);
            }
            .footer p {
                font-size: clamp(0.3125rem, 1.4vw, 0.375rem);
            }
        }

        /* ── Prevent any accidental scroll ────────────────────────────── */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">

            <!-- Logo image (BARVASSI) -->
            <img src="logo.png" alt="BARVASSI logo" class="logo" />

            <!-- Name + Verified Badge -->
            <div class="name-wrapper">
                <span class="name">Nader</span>
                <img src="bCH.png" alt="Verified" class="badge" />
            </div>

            <!-- Visual Identity Engineer — monospace -->
            <p class="title">Visual Identity Engineer</p>

            <!-- Statement — thin grotesk, italic -->
            <p class="statement">
                I build silent empires. You are standing at the door. It does not open for everyone.
            </p>

        </div>
    </div>

    <!-- Footer — fixed bottom, monospace -->
    <footer class="footer">
        <p>&copy; The House of Barvassi. All rights reserved. Silence is policy.</p>
    </footer>

</body>
</html>
