<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Admin Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 24px;
            padding: 48px;
            backdrop-filter: blur(8px);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 32px;
        }
        .header h1 {
            font-weight: 400;
            font-size: 28px;
            letter-spacing: 0.04em;
            opacity: 0.8;
        }
        .header .role-badge {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(255,255,255,0.06);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.5);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 20px 24px;
        }
        .stat-card .label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 300;
            margin-top: 4px;
            color: #f2f2f2;
        }
        .section-title {
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
            opacity: 0.6;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .user-table th {
            text-align: left;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .user-table td {
            padding: 12px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.7);
        }
        .user-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .badge-role {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 50px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .badge-role.cm {
            border-color: rgba(255,215,0,0.3);
            color: #f5c518;
        }
        .btn1 {
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn1:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .btn1.danger {
            background: rgba(180,40,40,0.2);
            color: rgba(255,100,100,0.7);
            border: 1px solid rgba(180,40,40,0.2);
        }
        .btn1.danger:hover {
            background: rgba(180,40,40,0.3);
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-weight: 300;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
        }
        @media (max-width: 700px) {
            .container { padding: 24px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .user-table { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="container" id="adminApp">
        <div id="loadingState" class="loading-spinner">🔒 Opening the vault...</div>
        
        <div id="adminContent" style="display:none;">
            <div class="header">
                <h1>⚡ Admin Vault</h1>
                <span class="role-badge" id="roleBadge">CM</span>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="label">Total Users</div>
                    <div class="value" id="totalUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Verified</div>
                    <div class="value" id="verifiedUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Pro Members</div>
                    <div class="value" id="proUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Your IP</div>
                    <div class="value" id="userIp" style="font-size:14px; font-weight:300;">—</div>
                </div>
            </div>

            <div class="section-title">User Registry</div>
            <div style="overflow-x:auto;">
                <table class="user-table" id="userTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>ID</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th style="text-align:right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="6" style="text-align:center; opacity:0.3; padding:40px 0;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
            <div style="margin-top: 24px; text-align:right; opacity:0.2; font-size:11px; letter-spacing:0.05em;">
                Secure Vault · Barvassi CM Access
            </div>
        </div>
    </div>

    <script>
        console.log("🔐 Admin Vault Initializing...");

        // ─── Supabase Client ────────────────────────────────────────────
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: { storage: localStorage, autoRefreshToken: true, persistSession: true }
                });
            } else {
                console.error("❌ Keys missing!");
            }
        } catch (e) { console.error('❌ Init error:', e); }

        const loadingState = document.getElementById('loadingState');
        const adminContent = document.getElementById('adminContent');

        // ─── Gatekeeper ──────────────────────────────────────────────────
        async function checkAdminAccess() {
            if (!supabaseClient) {
                window.location.href = '/';
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = '/';
                return;
            }

            // Fetch user profile from clients
            const { data: profile, error } = await supabaseClient
                .from('clients')
                .select('role, full_name, email')
                .eq('id', session.user.id)
                .maybeSingle();

            if (error || !profile || profile.role !== 'cm') {
                console.warn("⛔ Access denied: Not a CM.");
                window.location.href = '/dashboard';
                return;
            }

            // ✅ Access granted
            console.log("✅ CM Access Granted for:", profile.full_name);
            loadingState.style.display = 'none';
            adminContent.style.display = 'block';

            // Display IP (just for info)
            document.getElementById('userIp').textContent = window.location.hostname;

            // Load dashboard data
            loadDashboardData();
        }

        // ─── Load Data ──────────────────────────────────────────────────
        async function loadDashboardData() {
            try {
                // Fetch all users (only CM can do this due to RLS)
                const { data: users, error } = await supabaseClient
                    .from('clients')
                    .select('full_name, email, account_id, role, verification_status, subscription_status, id')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                // Stats
                const total = users.length;
                const verified = users.filter(u => u.verification_status === 'verified' || u.verification_status === 'pro').length;
                const pro = users.filter(u => u.subscription_status === 'pro').length;
                document.getElementById('totalUsers').textContent = total;
                document.getElementById('verifiedUsers').textContent = verified;
                document.getElementById('proUsers').textContent = pro;

                // Table
                const tbody = document.getElementById('userTableBody');
                if (users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; opacity:0.3; padding:40px 0;">No users yet.</td></tr>`;
                    return;
                }

                tbody.innerHTML = users.map(u => `
                    <tr>
                        <td>${u.full_name || '—'}</td>
                        <td>${u.email}</td>
                        <td style="font-family: monospace; font-size:12px; opacity:0.6;">${u.account_id || '—'}</td>
                        <td><span class="badge-role ${u.role === 'cm' ? 'cm' : ''}">${u.role || 'client'}</span></td>
                        <td>${u.verification_status || 'unverified'}</td>
                        <td style="text-align:right;">
                            <button class="btn1" style="padding:4px 12px; font-size:10px;" onclick="promoteUser('${u.id}')">Promote</button>
                            <button class="btn1 danger" style="padding:4px 12px; font-size:10px; margin-left:4px;" onclick="deleteUser('${u.id}')">Delete</button>
                        </td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error("❌ Failed to load data:", err);
                document.getElementById('userTableBody').innerHTML = `<tr><td colspan="6" style="text-align:center; color:rgba(180,40,40,0.5); padding:40px 0;">Error loading users.</td></tr>`;
            }
        }

        // ─── Actions (Placeholder) ──────────────────────────────────────
        window.promoteUser = function(userId) {
            if (confirm("Promote this user to CM? (This is irreversible without DB edit)")) {
                alert("Feature coming soon – promote via Supabase SQL for now.");
            }
        };

        window.deleteUser = function(userId) {
            if (confirm("Are you sure you want to delete this user? This action is logged.")) {
                alert("Feature coming soon – delete via Supabase SQL for now.");
            }
        };

        // ─── Start ──────────────────────────────────────────────────────
        checkAdminAccess();
    </script>
</body>
</html>
