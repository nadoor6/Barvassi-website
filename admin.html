<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · Admin Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            min-height: 100vh;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 24px;
            padding: 48px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-weight: 400;
            font-size: 28px;
            letter-spacing: 0.04em;
            opacity: 0.8;
        }
        .header .role-badge {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            background: rgba(255,255,255,0.06);
            padding: 6px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.5);
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 16px 20px;
        }
        .stat-card .label {
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 300;
            margin-top: 2px;
            color: #f2f2f2;
        }
        .stat-card .value .delta {
            font-size: 14px;
            opacity: 0.4;
            margin-left: 8px;
            font-weight: 300;
        }
        .section-title {
            font-weight: 400;
            font-size: 18px;
            letter-spacing: 0.04em;
            margin-bottom: 16px;
            opacity: 0.6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .section-title .toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .user-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .user-table th {
            text-align: left;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .user-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.7);
        }
        .user-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .user-table tr.deleted td {
            opacity: 0.3;
            text-decoration: line-through;
        }
        .user-table input[type="checkbox"] {
            accent-color: #f2f2f2;
            width: 16px;
            height: 16px;
            cursor: pointer;
            background: transparent;
        }
        .badge-role {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 50px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .badge-role.cm {
            border-color: rgba(255,215,0,0.3);
            color: #f5c518;
        }
        .badge-status {
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 50px;
            background: rgba(255,255,255,0.04);
        }
        .badge-status.verified { color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .badge-status.pro { color: #f5c518; border: 1px solid rgba(245,197,24,0.2); }
        .badge-status.unverified { color: rgba(255,255,255,0.3); }
        .badge-status.deleted { color: rgba(255,100,100,0.4); }
        .btn1 {
            background: #1a1a1a;
            color: #fafafa;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-weight: 400;
            font-size: 10px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .btn1:hover {
            background: #2a2a2a;
            transform: scale(1.02);
        }
        .btn1.danger {
            background: rgba(180,40,40,0.2);
            color: rgba(255,100,100,0.7);
            border: 1px solid rgba(180,40,40,0.2);
        }
        .btn1.danger:hover {
            background: rgba(180,40,40,0.3);
        }
        .btn1.success {
            background: rgba(40,180,40,0.2);
            color: rgba(100,255,100,0.7);
            border: 1px solid rgba(40,180,40,0.2);
        }
        .btn1.success:hover {
            background: rgba(40,180,40,0.3);
        }
        .btn1.warning {
            background: rgba(245,197,24,0.15);
            color: rgba(245,197,24,0.7);
            border: 1px solid rgba(245,197,24,0.15);
        }
        .btn1.warning:hover {
            background: rgba(245,197,24,0.25);
        }
        .btn1:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn1.small {
            padding: 4px 10px;
            font-size: 9px;
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            font-weight: 300;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12,12,12,0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 14px 28px;
            color: #f2f2f2;
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.05em;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(-20px) scale(0.95);
            transition: all 0.4s cubic-bezier(0.22,1,0.36,1);
            pointer-events: none;
            z-index: 9999;
            max-width: 90vw;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .toast.error {
            border-color: rgba(180,40,40,0.3);
            background: rgba(30,10,10,0.85);
        }
        .toast.success {
            border-color: rgba(40,180,40,0.3);
            background: rgba(10,30,10,0.85);
        }
        .toast.info {
            border-color: rgba(40,100,200,0.3);
            background: rgba(10,20,40,0.85);
        }
        .log-container {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 12px;
        }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .log-entry {
            font-family: monospace;
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.5);
        }
        .log-entry .time { color: rgba(255,255,255,0.2); }
        .log-entry .admin { color: #f5c518; }
        .log-entry .action { color: #4a90e2; }
        .log-entry .target { color: #f2f2f2; }
        .bulk-bar {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .bulk-bar.visible {
            display: flex;
        }
        .bulk-bar .count {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-right: 8px;
        }
        @media (max-width: 700px) {
            .container { padding: 24px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .user-table { font-size: 12px; }
            .header { flex-direction: column; align-items: flex-start; }
            .header-actions { width: 100%; justify-content: flex-start; }
            .bulk-bar { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- Toast -->
    <div class="toast" id="toast"><span id="toastMsg">Success</span></div>

    <div class="container" id="adminApp">
        <div id="loadingState" class="loading-spinner">🔒 Opening the vault...</div>
        
        <div id="adminContent" style="display:none;">
            <div class="header">
                <h1>⚡ Admin Vault</h1>
                <div class="header-actions">
                    <span class="role-badge" id="roleBadge">CM</span>
                    <button class="btn1" id="refreshBtn" style="padding:4px 14px; font-size:10px;">⟳ Refresh</button>
                    <button class="btn1 success" id="exportBtn" style="padding:4px 14px; font-size:10px;">⬇ Export</button>
                    <button class="btn1 danger" id="logoutBtn" style="padding:4px 14px; font-size:10px;">Logout</button>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid">
                <div class="stat-card">
                    <div class="label">Total Users</div>
                    <div class="value" id="totalUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Verified</div>
                    <div class="value" id="verifiedUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Pro Members</div>
                    <div class="value" id="proUsers">—</div>
                </div>
                <div class="stat-card">
                    <div class="label">Your IP</div>
                    <div class="value" id="userIp" style="font-size:14px; font-weight:300;">—</div>
                </div>
            </div>

            <div class="section-title">
                <span>User Registry</span>
                <div class="toolbar">
                    <button class="btn1 small" id="showDeletedBtn" style="padding:4px 10px; font-size:9px; opacity:0.5;">Show Deleted</button>
                </div>
            </div>

            <!-- Bulk Action Bar -->
            <div class="bulk-bar" id="bulkBar">
                <span class="count" id="bulkCount">0 selected</span>
                <button class="btn1 success small" id="bulkVerifyBtn">Verify</button>
                <button class="btn1 warning small" id="bulkPromoteBtn">Promote to CM</button>
                <button class="btn1 danger small" id="bulkDeleteBtn">Delete</button>
                <button class="btn1 small" id="bulkClearBtn" style="background:transparent; border:1px solid rgba(255,255,255,0.1);">Clear</button>
            </div>

            <div style="overflow-x:auto;">
                <table class="user-table" id="userTable">
                    <thead>
                        <tr>
                            <th style="width:30px;"><input type="checkbox" id="selectAll" /></th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>ID</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="7" style="text-align:center; opacity:0.3; padding:40px 0;">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>

            <div style="margin-top: 32px;">
                <div class="section-title" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
                    <span>Audit Logs</span>
                    <button class="btn1 small" id="refreshLogsBtn" style="padding:4px 14px; font-size:10px;">⟳ Refresh Logs</button>
                </div>
                <div class="log-container" id="logContainer">
                    <div style="text-align:center; opacity:0.3; padding:20px 0;">No logs yet.</div>
                </div>
            </div>

            <div style="margin-top: 24px; text-align:right; opacity:0.2; font-size:11px; letter-spacing:0.05em;">
                Secure Vault · Barvassi CM Access
            </div>
        </div>
    </div>

    <script>
        console.log("🔐 Admin Vault Initializing...");

        // ─── Toast ──────────────────────────────────────────────────────
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        let toastTimeout;

        function showToast(message, type = 'success') {
            clearTimeout(toastTimeout);
            toastMsg.textContent = message;
            toastEl.className = 'toast';
            if (type === 'error') toastEl.classList.add('error');
            else if (type === 'success') toastEl.classList.add('success');
            else if (type === 'info') toastEl.classList.add('info');
            toastEl.classList.add('show');
            toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 4000);
        }

        // ─── Supabase Client ────────────────────────────────────────────
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: { storage: localStorage, autoRefreshToken: true, persistSession: true }
                });
            }
        } catch (e) { console.error('❌ Init error:', e); }

        const loadingState = document.getElementById('loadingState');
        const adminContent = document.getElementById('adminContent');
        let currentAdminId = null;
        let allUsers = [];
        let showDeleted = false;
        let selectedUsers = new Set();

        // ─── Admin Session Hardening (15 min timeout) ──────────────────
        const ADMIN_INACTIVITY_MS = 15 * 60 * 1000; // 15 minutes
        let adminInactivityTimer;

        function resetAdminTimer() {
            clearTimeout(adminInactivityTimer);
            adminInactivityTimer = setTimeout(async () => {
                showToast('Admin session expired. Logging out...', 'error');
                await supabaseClient.auth.signOut();
                window.location.href = '/';
            }, ADMIN_INACTIVITY_MS);
        }
        document.addEventListener('mousemove', resetAdminTimer);
        document.addEventListener('mousedown', resetAdminTimer);
        document.addEventListener('keypress', resetAdminTimer);
        document.addEventListener('touchstart', resetAdminTimer);
        // Initial start after login

        // ─── Gatekeeper ──────────────────────────────────────────────────
        async function checkAdminAccess() {
            if (!supabaseClient) { window.location.href = '/'; return; }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = '/'; return; }

            const { data: profile, error } = await supabaseClient
                .from('clients')
                .select('id, role, full_name, email')
                .eq('id', session.user.id)
                .maybeSingle();

            if (error || !profile || profile.role !== 'cm') {
                console.warn("⛔ Access denied: Not a CM.");
                window.location.href = '/dashboard';
                return;
            }

            currentAdminId = profile.id;
            console.log("✅ CM Access Granted for:", profile.full_name);

            // Start admin session timer
            resetAdminTimer();

            loadingState.style.display = 'none';
            adminContent.style.display = 'block';
            document.getElementById('userIp').textContent = window.location.hostname;

            // Set up event listeners
            setupEventListeners();

            // Load data
            await loadDashboardData();
            await loadAuditLogs();

            // Start real-time subscription
            setupRealtimeSubscription();
        }

        // ─── Setup Event Listeners ──────────────────────────────────────
        function setupEventListeners() {
            document.getElementById('refreshBtn').addEventListener('click', async () => {
                await loadDashboardData();
                await loadAuditLogs();
                showToast('Refreshed', 'success');
            });
            document.getElementById('refreshLogsBtn').addEventListener('click', loadAuditLogs);
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = '/';
            });
            document.getElementById('selectAll').addEventListener('change', function() {
                const checkboxes = document.querySelectorAll('.user-checkbox');
                checkboxes.forEach(cb => cb.checked = this.checked);
                updateBulkSelection();
            });
            document.getElementById('bulkClearBtn').addEventListener('click', () => {
                document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
                updateBulkSelection();
            });
            document.getElementById('bulkVerifyBtn').addEventListener('click', () => bulkAction('verify'));
            document.getElementById('bulkPromoteBtn').addEventListener('click', () => bulkAction('promote'));
            document.getElementById('bulkDeleteBtn').addEventListener('click', () => bulkAction('delete'));
            document.getElementById('showDeletedBtn').addEventListener('click', function() {
                showDeleted = !showDeleted;
                this.textContent = showDeleted ? 'Hide Deleted' : 'Show Deleted';
                this.style.opacity = showDeleted ? '1' : '0.5';
                renderTable(allUsers);
            });
            document.getElementById('exportBtn').addEventListener('click', exportCSV);
        }

        // ─── Real-time Subscription ─────────────────────────────────────
        function setupRealtimeSubscription() {
            supabaseClient
                .channel('clients_changes')
                .on('postgres_changes', { 
                    event: 'INSERT', 
                    schema: 'public', 
                    table: 'clients',
                    filter: 'deleted_at=is.null'
                }, (payload) => {
                    const newUser = payload.new;
                    showToast(`🆕 New user signed up: ${newUser.full_name || newUser.email}`, 'info');
                    loadDashboardData();
                    loadAuditLogs();
                })
                .subscribe();
        }

        // ─── Load Dashboard Data ────────────────────────────────────────
        async function loadDashboardData() {
            try {
                const query = supabaseClient
                    .from('clients')
                    .select('full_name, email, account_id, role, verification_status, subscription_status, id, deleted_at, created_at')
                    .order('created_at', { ascending: false });

                if (!showDeleted) {
                    query.is('deleted_at', null);
                }

                const { data: users, error } = await query;
                if (error) throw error;

                allUsers = users || [];

                // Stats (only active users for stats)
                const active = users.filter(u => u.deleted_at === null);
                const total = active.length;
                const verified = active.filter(u => u.verification_status === 'verified' || u.verification_status === 'pro').length;
                const pro = active.filter(u => u.subscription_status === 'pro').length;
                document.getElementById('totalUsers').textContent = total;
                document.getElementById('verifiedUsers').textContent = verified;
                document.getElementById('proUsers').textContent = pro;

                renderTable(users);
                updateBulkSelection();

            } catch (err) {
                console.error("❌ Failed to load data:", err);
                showToast('Error loading users', 'error');
            }
        }

        // ─── Render Table ───────────────────────────────────────────────
        function renderTable(users) {
            const tbody = document.getElementById('userTableBody');
            if (!users || users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; opacity:0.3; padding:40px 0;">No users found.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => {
                const isSelf = u.id === currentAdminId;
                const isDeleted = u.deleted_at !== null;
                const statusClass = u.verification_status === 'verified' || u.verification_status === 'pro' ? 'verified' : 'unverified';
                if (u.verification_status === 'pro') statusClass = 'pro';
                const statusDisplay = isDeleted ? 'Deleted' : (u.verification_status || 'unverified');

                return `
                    <tr class="${isDeleted ? 'deleted' : ''}">
                        <td><input type="checkbox" class="user-checkbox" data-id="${u.id}" ${isDeleted ? 'disabled' : ''} /></td>
                        <td>${u.full_name || '—'}</td>
                        <td>${u.email}</td>
                        <td style="font-family: monospace; font-size:12px; opacity:0.6;">${u.account_id || '—'}</td>
                        <td><span class="badge-role ${u.role === 'cm' ? 'cm' : ''}">${u.role || 'client'}</span></td>
                        <td><span class="badge-status ${statusClass}">${statusDisplay}</span></td>
                        <td style="text-align:right; white-space:nowrap;">
                            ${!isDeleted && u.role !== 'cm' ? `<button class="btn1 small" onclick="promoteUser('${u.id}')">Promote</button>` : 
                              !isDeleted && u.role === 'cm' && !isSelf ? `<button class="btn1 danger small" onclick="demoteUser('${u.id}')">Demote</button>` : ''}
                            ${!isDeleted && u.verification_status !== 'verified' && u.verification_status !== 'pro' ? 
                                `<button class="btn1 success small" style="margin-left:4px;" onclick="verifyUser('${u.id}')">Verify</button>` : ''}
                            ${!isDeleted && !isSelf ? `<button class="btn1 danger small" style="margin-left:4px;" onclick="deleteUser('${u.id}')">Delete</button>` : 
                              !isDeleted && isSelf ? `<span style="font-size:9px; opacity:0.3; margin-left:8px;">(you)</span>` : ''}
                            ${isDeleted ? `<span style="font-size:9px; opacity:0.3;">deleted</span>` : ''}
                        </td>
                    </tr>
                `;
            }).join('');

            // Re-bind checkbox events
            document.querySelectorAll('.user-checkbox').forEach(cb => {
                cb.addEventListener('change', updateBulkSelection);
            });

            // Re-bind select all
            const selectAll = document.getElementById('selectAll');
            const checkboxes = document.querySelectorAll('.user-checkbox:not(:disabled)');
            selectAll.checked = checkboxes.length > 0 && checkboxes.every(cb => cb.checked);
        }

        // ─── Bulk Selection ─────────────────────────────────────────────
        function updateBulkSelection() {
            const checkboxes = document.querySelectorAll('.user-checkbox:checked:not(:disabled)');
            selectedUsers = new Set(Array.from(checkboxes).map(cb => cb.dataset.id));
            const count = selectedUsers.size;
            document.getElementById('bulkCount').textContent = `${count} selected`;
            document.getElementById('bulkBar').classList.toggle('visible', count > 0);
            document.getElementById('bulkVerifyBtn').disabled = count === 0;
            document.getElementById('bulkPromoteBtn').disabled = count === 0;
            document.getElementById('bulkDeleteBtn').disabled = count === 0;
        }

        // ─── Bulk Actions ───────────────────────────────────────────────
        async function bulkAction(action) {
            const ids = Array.from(selectedUsers);
            if (ids.length === 0) return;

            const actionMap = {
                verify: { label: 'Verify', fn: verifyUser },
                promote: { label: 'Promote to CM', fn: promoteUser },
                delete: { label: 'Delete', fn: deleteUser }
            };

            const { label, fn } = actionMap[action];
            if (!confirm(`Are you sure you want to ${label} ${ids.length} user(s)?`)) return;

            let success = 0;
            let failed = 0;

            for (const id of ids) {
                try {
                    await fn(id, true); // silent mode
                    success++;
                } catch (e) {
                    failed++;
                }
            }

            showToast(`${label}ed ${success} user(s)${failed > 0 ? `, ${failed} failed` : ''}`, success > 0 ? 'success' : 'error');
            await loadDashboardData();
            await loadAuditLogs();
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
            updateBulkSelection();
        }

        // ─── Individual Actions ──────────────────────────────────────────
        window.promoteUser = async function(userId, silent = false) {
            if (!silent && !confirm('Promote this user to Creative Manager (CM)?')) return;
            try {
                const { error } = await supabaseClient
                    .from('clients')
                    .update({ role: 'cm' })
                    .eq('id', userId);
                if (error) throw error;
                await logAction('promote_user', userId, { new_role: 'cm' });
                if (!silent) showToast('User promoted to CM', 'success');
                if (!silent) { await loadDashboardData(); await loadAuditLogs(); }
            } catch (err) {
                if (!silent) showToast('Failed: ' + err.message, 'error');
                throw err;
            }
        };

        window.demoteUser = async function(userId) {
            if (!confirm('Demote this CM to regular client?')) return;
            try {
                const { error } = await supabaseClient
                    .from('clients')
                    .update({ role: 'client' })
                    .eq('id', userId);
                if (error) throw error;
                await logAction('demote_user', userId, { new_role: 'client' });
                showToast('User demoted to client', 'success');
                await loadDashboardData();
                await loadAuditLogs();
            } catch (err) {
                showToast('Failed: ' + err.message, 'error');
            }
        };

        window.verifyUser = async function(userId, silent = false) {
            if (!silent && !confirm('Verify this user\'s identity?')) return;
            try {
                const { error } = await supabaseClient
                    .from('clients')
                    .update({ verification_status: 'verified' })
                    .eq('id', userId);
                if (error) throw error;
                await logAction('verify_user', userId, { new_status: 'verified' });
                if (!silent) showToast('User verified', 'success');
                if (!silent) { await loadDashboardData(); await loadAuditLogs(); }
            } catch (err) {
                if (!silent) showToast('Failed: ' + err.message, 'error');
                throw err;
            }
        };

        window.deleteUser = async function(userId, silent = false) {
            if (!silent) {
                const name = prompt('Type "DELETE" to confirm soft-delete:');
                if (name !== 'DELETE') return;
            }
            try {
                // Soft-delete: set deleted_at
                const { error } = await supabaseClient
                    .from('clients')
                    .update({ deleted_at: new Date().toISOString() })
                    .eq('id', userId);
                if (error) throw error;
                const { data: user } = await supabaseClient
                    .from('clients')
                    .select('email')
                    .eq('id', userId)
                    .single();
                await logAction('delete_user', userId, { email: user?.email || 'unknown', soft: true });
                if (!silent) showToast('User soft-deleted', 'success');
                if (!silent) { await loadDashboardData(); await loadAuditLogs(); }
            } catch (err) {
                if (!silent) showToast('Failed: ' + err.message, 'error');
                throw err;
            }
        };

        // ─── Log Action ──────────────────────────────────────────────────
        async function logAction(action, targetUserId = null, details = null) {
            if (!currentAdminId) return;
            try {
                const ip = await fetch('https://api.ipify.org?format=json').then(r => r.json()).then(d => d.ip).catch(() => 'unknown');
                await supabaseClient
                    .from('admin_logs')
                    .insert([{
                        admin_id: currentAdminId,
                        action: action,
                        target_user_id: targetUserId,
                        details: details,
                        ip: ip || 'unknown'
                    }]);
            } catch (e) { console.warn('Logging failed:', e); }
        }

        // ─── Load Audit Logs ────────────────────────────────────────────
        async function loadAuditLogs() {
            try {
                const { data: logs, error } = await supabaseClient
                    .from('admin_logs')
                    .select(`
                        id, action, details, ip, created_at,
                        admin:clients!admin_id(full_name),
                        target_user:clients!target_user_id(full_name)
                    `)
                    .order('created_at', { ascending: false })
                    .limit(50);

                if (error) throw error;

                const container = document.getElementById('logContainer');
                if (!logs || logs.length === 0) {
                    container.innerHTML = `<div style="text-align:center; opacity:0.3; padding:20px 0;">No logs yet.</div>`;
                    return;
                }

                container.innerHTML = logs.map(log => {
                    const time = new Date(log.created_at).toLocaleString();
                    const adminName = log.admin?.full_name || 'Unknown';
                    const targetName = log.target_user?.full_name || '—';
                    const action = log.action || 'action';
                    const details = log.details ? JSON.stringify(log.details) : '';
                    return `
                        <div class="log-entry">
                            <span class="time">${time}</span>
                            <span class="admin">${adminName}</span>
                            <span class="action">${action}</span>
                            ${targetName !== '—' ? `<span class="target">→ ${targetName}</span>` : ''}
                            ${details ? `<span style="opacity:0.4; font-size:10px;"> ${details}</span>` : ''}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("❌ Failed to load logs:", err);
            }
        }

        // ─── Export CSV ──────────────────────────────────────────────────
        function exportCSV() {
            const active = allUsers.filter(u => u.deleted_at === null);
            if (active.length === 0) {
                showToast('No users to export.', 'error');
                return;
            }

            const headers = ['Full Name', 'Email', 'Account ID', 'Role', 'Verification Status', 'Subscription', 'Joined At'];
            const rows = active.map(u => [
                u.full_name || '',
                u.email || '',
                u.account_id || '',
                u.role || 'client',
                u.verification_status || 'unverified',
                u.subscription_status || 'none',
                u.created_at ? new Date(u.created_at).toLocaleDateString() : ''
            ]);

            const csvContent = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `barvassi_users_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('Users exported', 'success');
        }

        // ─── Start ──────────────────────────────────────────────────────
        checkAdminAccess();
    </script>
</body>
</html>
