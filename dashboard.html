    <script>
        console.log("✅ Dashboard Script Loaded");

        // Initialize Supabase client with explicit localStorage for session persistence
        let supabaseClient = null;
        let sessionRestored = false;
        let redirectTimeout = null;

        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                    auth: {
                        storage: localStorage,
                        autoRefreshToken: true,
                        persistSession: true,
                    }
                });
                console.log("✅ Supabase Client Created with localStorage persistence");
            } else {
                console.error("❌ Keys are missing!");
            }
        } catch (e) {
            console.error('❌ Supabase init error:', e);
        }

        // ---- LOGO ----
        function loadBrandLogo() {
            const logoEl = document.getElementById('brandLogo');
            const textFallback = document.getElementById('brandTextFallback');
            if (typeof BARVASSI_LOGO === 'string' && BARVASSI_LOGO.startsWith('data:image')) {
                logoEl.src = BARVASSI_LOGO;
                logoEl.style.display = 'inline-block';
                textFallback.style.display = 'none';
                console.log("✅ Logo loaded from logo.js");
            } else {
                console.warn("⚠️ BARVASSI_LOGO not found. Using fallback.");
                logoEl.style.display = 'none';
                textFallback.style.display = 'block';
            }
        }

        // ---- NOTIFICATION ----
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        let toastTimeout;
        function showNotification(message, type = 'success') {
            clearTimeout(toastTimeout);
            toastMsg.textContent = message;
            toast.classList.remove('error');
            if (type === 'error') { toast.classList.add('error'); }
            toast.classList.add('show');
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 5000);
        }

        // ---- DOM refs ----
        const avatarBtn = document.getElementById('avatarBtn');
        const avatarInitials = document.getElementById('avatarInitials');
        const avatarImg = document.getElementById('avatarImg');
        const dropAvatar = document.getElementById('dropAvatar');
        const dropInitials = document.getElementById('dropInitials');
        const dropImg = document.getElementById('dropImg');
        const dropName = document.getElementById('dropName');
        const dropEmail = document.getElementById('dropEmail');
        const dropId = document.getElementById('dropId');
        const dropEmailDetail = document.getElementById('dropEmailDetail');
        const dropPhoneText = document.getElementById('dropPhoneText');
        const dropPhoneEdit = document.getElementById('dropPhoneEdit');
        const phoneInputEdit = document.getElementById('phoneInputEdit');
        const phoneSaveBtn = document.getElementById('phoneSaveBtn');
        const phoneCancelBtn = document.getElementById('phoneCancelBtn');
        const phoneEditBtn = document.getElementById('phoneEditBtn');
        const dropVerification = document.getElementById('dropVerification');
        const dropSubscription = document.getElementById('dropSubscription');
        const verifyBtn = document.getElementById('verifyBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const dropdownOverlay = document.getElementById('dropdownOverlay');
        const dropdown = document.getElementById('dropdown');
        const avatarInput = document.getElementById('avatarInput');

        // ---- Cropper elements ----
        const cropperModal = document.getElementById('cropper-modal');
        const cropperImage = document.getElementById('cropperImage');
        const cropperCircle = document.getElementById('cropperCircle');
        const cropperWrapper = document.getElementById('cropperWrapper');
        const cropperCancel = document.getElementById('cropperCancel');
        const cropperDone = document.getElementById('cropperDone');
        const cropSizeSlider = document.getElementById('cropSizeSlider');

        let currentUser = null;
        let userProfile = null;
        let selectedFile = null;

        // ---- Auth state listener for session restoration ----
        supabaseClient.auth.onAuthStateChange((event, session) => {
            console.log('🔄 Auth state changed:', event, session ? 'session exists' : 'no session');
            if (event === 'SIGNED_OUT') {
                // Redirect to home on sign out
                if (!sessionRestored) {
                    window.location.href = '/';
                }
            }
            if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
                sessionRestored = true;
                if (redirectTimeout) {
                    clearTimeout(redirectTimeout);
                    redirectTimeout = null;
                }
                // Load profile now that we have a session
                if (!userProfile) {
                    loadProfile();
                }
            }
        });

        // ---- Check for existing session on page load ----
        async function checkSessionAndLoad() {
            // First, check if there's a session in localStorage directly (fast)
            const storedSession = localStorage.getItem('supabase.auth.token');
            if (storedSession) {
                console.log("📦 Found session in localStorage, attempting restore...");
                // Try to get session from Supabase
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    sessionRestored = true;
                    loadProfile();
                    return;
                }
            }

            // If we reach here, either no session or not restored yet.
            // We'll wait for the auth state event, but set a timeout to avoid infinite waiting.
            console.log("⏳ No immediate session, waiting for auth state...");
            redirectTimeout = setTimeout(() => {
                // Check again if session is now available
                supabaseClient.auth.getSession().then(({ data: { session } }) => {
                    if (session) {
                        sessionRestored = true;
                        loadProfile();
                    } else {
                        console.log("🚫 No session after timeout, redirecting.");
                        window.location.href = '/';
                    }
                }).catch(() => {
                    window.location.href = '/';
                });
            }, 3000);
        }

        // ---- Profile loading ----
        async function loadProfile() {
            console.log("⏳ Loading profile...");
            const authResponse = await supabaseClient.auth.getSession();
            const session = authResponse.data.session;
            if (!session) {
                console.log("🚫 No session, redirecting.");
                window.location.href = '/';
                return;
            }
            currentUser = session.user;
            console.log("✅ User ID:", currentUser.id);

            const { data, error } = await supabaseClient.from('clients').select('*').eq('id', currentUser.id).maybeSingle();
            if (error) {
                console.error('❌ Profile fetch error:', error);
                dropName.textContent = 'Error';
                return;
            }

            if (!data) {
                console.warn("⚠️ Profile missing. Auto-creating...");
                let name = currentUser.user_metadata?.full_name || 'Member';
                const { data: idData, error: idError } = await supabaseClient.rpc('generate_barvassi_id');
                if (idError) console.error("ID gen error", idError);
                const accountId = idData || 'BA' + Math.random().toString(36).substring(2, 8).toUpperCase();
                const { error: insertError } = await supabaseClient.from('clients').insert([
                    { id: currentUser.id, full_name: name, email: currentUser.email, account_id: accountId }
                ]);
                if (insertError) {
                    console.error("❌ Failed to auto-create profile", insertError);
                    return;
                }
                const { data: newData, error: newError } = await supabaseClient.from('clients').select('*').eq('id', currentUser.id).single();
                userProfile = newData;
                renderProfile();
                return;
            }
            userProfile = data;
            console.log("✅ Profile data loaded");
            renderProfile();
        }

        // ---- Render profile ----
        function renderProfile() {
            if (!userProfile) { dropName.textContent = 'Loading...'; return; }
            const p = userProfile;
            const name = p.full_name || 'Member';
            const initial = name.charAt(0).toUpperCase();

            const cacheKey = localStorage.getItem('barvassi_avatar_timestamp') || Date.now();

            if (p.avatar_url) {
                const bustedSrc = p.avatar_url + '?t=' + cacheKey;
                avatarImg.src = bustedSrc;
                avatarImg.style.display = 'block';
                avatarInitials.style.display = 'none';
                dropImg.src = bustedSrc;
                dropImg.style.display = 'block';
                dropInitials.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                avatarInitials.style.display = 'block';
                avatarInitials.textContent = initial;
                dropImg.style.display = 'none';
                dropInitials.style.display = 'block';
                dropInitials.textContent = initial;
            }
            dropName.textContent = name;
            dropEmail.textContent = p.email;
            dropId.textContent = p.account_id || '—';
            dropEmailDetail.textContent = p.email;
            dropPhoneText.textContent = p.phone || '—';

            let verificationText = 'Unverified';
            if (p.verification_status === 'verified') verificationText = 'Verified';
            else if (p.verification_status === 'pro') verificationText = 'Pro';
            dropVerification.textContent = verificationText;

            if (p.subscription_status === 'pro') dropSubscription.textContent = 'Pro';
            else dropSubscription.textContent = 'None';

            // ---- Render badge using images from checkmarks.js ----
            const badgeContainer = document.getElementById('badgeContainer');
            badgeContainer.innerHTML = ''; // clear

            let badgeHtml = '';
            if (p.verification_status === 'verified') {
                if (typeof BLUE_CHECKMARK !== 'undefined' && BLUE_CHECKMARK) {
                    console.log("✅ Using BLUE_CHECKMARK from checkmarks.js");
                    badgeHtml = `<img src="${BLUE_CHECKMARK}" alt="Verified" />`;
                } else {
                    console.warn("⚠️ BLUE_CHECKMARK not found, using fallback");
                    badgeHtml = '<span class="fallback badge-blue">✓</span>';
                }
            } else if (p.verification_status === 'pro') {
                if (typeof GOLD_CHECKMARK !== 'undefined' && GOLD_CHECKMARK) {
                    console.log("✅ Using GOLD_CHECKMARK from checkmarks.js");
                    badgeHtml = `<img src="${GOLD_CHECKMARK}" alt="Pro" />`;
                } else {
                    console.warn("⚠️ GOLD_CHECKMARK not found, using fallback");
                    badgeHtml = '<span class="fallback badge-gold">★</span>';
                }
            }
            badgeContainer.innerHTML = badgeHtml;

            // Enable/disable upgrade button
            upgradeBtn.disabled = p.verification_status !== 'verified';
        }

        // ---- Dropdown ----
        function openDropdown() { dropdownOverlay.classList.add('open'); dropdown.classList.add('open'); phoneEditBtn.style.display = 'inline-block'; dropPhoneEdit.style.display = 'none'; dropPhoneText.style.display = 'inline'; }
        function closeDropdown() { dropdownOverlay.classList.remove('open'); dropdown.classList.remove('open'); }
        avatarBtn.addEventListener('click', (e) => { e.stopPropagation(); if (dropdown.classList.contains('open')) closeDropdown(); else openDropdown(); });
        dropdownOverlay.addEventListener('click', (e) => { if (e.target === dropdownOverlay) closeDropdown(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDropdown(); });

        // ---- Phone ----
        phoneEditBtn.addEventListener('click', () => { if (!userProfile) return; phoneEditBtn.style.display = 'none'; dropPhoneText.style.display = 'none'; dropPhoneEdit.style.display = 'flex'; phoneInputEdit.value = userProfile.phone || ''; });
        phoneCancelBtn.addEventListener('click', () => { dropPhoneEdit.style.display = 'none'; dropPhoneText.style.display = 'inline'; phoneEditBtn.style.display = 'inline-block'; });
        phoneSaveBtn.addEventListener('click', async () => {
            if (!userProfile) return;
            const newPhone = phoneInputEdit.value.trim();
            const { error } = await supabaseClient.from('clients').update({ phone: newPhone }).eq('id', currentUser.id);
            if (error) { console.error('❌ Phone update error:', error); showNotification('Failed to update phone.', 'error'); }
            else { userProfile.phone = newPhone; dropPhoneText.textContent = newPhone || '—'; dropPhoneEdit.style.display = 'none'; dropPhoneText.style.display = 'inline'; phoneEditBtn.style.display = 'inline-block'; showNotification('Phone number updated.'); }
        });

        // ---- Verify & Upgrade ----
        verifyBtn.addEventListener('click', async () => {
            if (!userProfile || userProfile.verification_status !== 'unverified') { showNotification('Already verified or pro.', 'error'); return; }
            const { error } = await supabaseClient.from('clients').update({ verification_status: 'verified' }).eq('id', currentUser.id);
            if (error) { console.error('❌ Verification error:', error); showNotification('Verification failed: ' + error.message, 'error'); }
            else { userProfile.verification_status = 'verified'; renderProfile(); showNotification('Identity verified!'); }
        });
        upgradeBtn.addEventListener('click', async () => {
            if (!userProfile || userProfile.verification_status !== 'verified') { showNotification('Please verify your identity first.', 'error'); return; }
            const { error } = await supabaseClient.from('clients').update({ verification_status: 'pro', subscription_status: 'pro' }).eq('id', currentUser.id);
            if (error) { console.error('❌ Upgrade error:', error); showNotification('Upgrade failed: ' + error.message, 'error'); }
            else { userProfile.verification_status = 'pro'; userProfile.subscription_status = 'pro'; renderProfile(); showNotification('Welcome to Pro!'); }
        });

        // ---- Logout ----
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = '/';
        });

        // ---- Inactivity Timer ----
        // Set to 100 hours = 360,000,000 ms
        const INACTIVITY_TIMEOUT_MS = 100 * 60 * 60 * 1000; // 100 hours

        let inactivityTimer;
        function resetTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                showNotification('Session expired. Logging out...');
                setTimeout(() => {
                    supabaseClient.auth.signOut();
                    window.location.href = '/';
                }, 1500);
            }, INACTIVITY_TIMEOUT_MS);
        }
        // Reset on user activity
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('mousedown', resetTimer);
        document.addEventListener('keypress', resetTimer);
        document.addEventListener('touchstart', resetTimer); // for mobile
        resetTimer();

        // ================================================================
        // ===== CROPPER LOGIC (with btn1 loading state) =====
        // ================================================================

        let cropX = 0, cropY = 0;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let circleSize = 160;
        let maxCircleSize = 400;

        function openCropper(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                cropperModal.classList.add('open');
                cropperImage.src = e.target.result;
                cropperImage.onload = () => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            const wrapper = cropperWrapper;
                            const w = wrapper.offsetWidth;
                            const h = wrapper.offsetHeight;

                            if (w === 0 || h === 0) {
                                const rect = wrapper.getBoundingClientRect();
                                const w2 = rect.width;
                                const h2 = rect.height;
                                if (w2 === 0 || h2 === 0) {
                                    showNotification('Could not determine image dimensions.', 'error');
                                    maxCircleSize = 200;
                                } else {
                                    let rawMax = Math.min(w2, h2);
                                    if (rawMax < 20) rawMax = 20;
                                    if (rawMax > 800) rawMax = 800;
                                    maxCircleSize = rawMax;
                                }
                            } else {
                                let rawMax = Math.min(w, h);
                                if (rawMax < 20) rawMax = 20;
                                if (rawMax > 800) rawMax = 800;
                                maxCircleSize = rawMax;
                            }

                            cropSizeSlider.min = 20;
                            cropSizeSlider.max = maxCircleSize;
                            circleSize = maxCircleSize;
                            cropSizeSlider.value = circleSize;

                            cropperCircle.style.width = circleSize + 'px';
                            cropperCircle.style.height = circleSize + 'px';

                            const rect = wrapper.getBoundingClientRect();
                            cropX = rect.width / 2;
                            cropY = rect.height / 2;
                            updateCirclePosition();
                        });
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        function updateCirclePosition() {
            cropperCircle.style.left = cropX + 'px';
            cropperCircle.style.top = cropY + 'px';
        }

        cropSizeSlider.addEventListener('input', (e) => {
            const newSize = parseFloat(e.target.value);
            if (isNaN(newSize) || newSize < 1) return;
            circleSize = newSize;
            cropperCircle.style.width = circleSize + 'px';
            cropperCircle.style.height = circleSize + 'px';

            const rect = cropperWrapper.getBoundingClientRect();
            const half = circleSize / 2;
            cropX = Math.max(half, Math.min(rect.width - half, cropX));
            cropY = Math.max(half, Math.min(rect.height - half, cropY));
            updateCirclePosition();
        });

        function startDrag(e) {
            const clientX = e.clientX || e.touches?.[0]?.clientX;
            const clientY = e.clientY || e.touches?.[0]?.clientY;
            if (!clientX) return;
            isDragging = true;
            dragStartX = clientX - cropX;
            dragStartY = clientY - cropY;
            cropperCircle.style.cursor = 'grabbing';
        }

        function onDrag(e) {
            if (!isDragging) return;
            const clientX = e.clientX || e.touches?.[0]?.clientX;
            const clientY = e.clientY || e.touches?.[0]?.clientY;
            if (!clientX) return;
            const rect = cropperWrapper.getBoundingClientRect();
            let newX = clientX - dragStartX;
            let newY = clientY - dragStartY;
            const half = circleSize / 2;
            newX = Math.max(half, Math.min(rect.width - half, newX));
            newY = Math.max(half, Math.min(rect.height - half, newY));
            cropX = newX;
            cropY = newY;
            updateCirclePosition();
        }

        function endDrag() {
            isDragging = false;
            cropperCircle.style.cursor = 'grab';
        }

        cropperCircle.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', onDrag);
        document.addEventListener('mouseup', endDrag);
        cropperCircle.addEventListener('touchstart', (e) => { e.preventDefault(); startDrag(e); });
        document.addEventListener('touchmove', (e) => { e.preventDefault(); onDrag(e); });
        document.addEventListener('touchend', endDrag);

        cropperCancel.addEventListener('click', () => {
            cropperModal.classList.remove('open');
            selectedFile = null;
        });

        // ---- CROPPER DONE with proper loading state and file type validation ----
        cropperDone.addEventListener('click', async function() {
            if (!selectedFile || !currentUser) return;

            // Validate file type (extra safety)
            const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'image/gif', 'image/bmp'];
            if (!allowedTypes.includes(selectedFile.type)) {
                showNotification('Unsupported file format. Please use JPG, PNG, WebP, GIF, or BMP.', 'error');
                return;
            }

            this.classList.add('loading');
            this.disabled = true;

            try {
                const img = cropperImage;
                if (!img || !img.complete || img.naturalWidth === 0 || img.naturalHeight === 0) {
                    showNotification('Image not loaded properly. Try again.', 'error');
                    return;
                }

                const naturalWidth = img.naturalWidth;
                const naturalHeight = img.naturalHeight;
                const displayWidth = img.clientWidth;
                const displayHeight = img.clientHeight;

                if (displayWidth === 0 || displayHeight === 0) {
                    showNotification('Display size error. Try refreshing.', 'error');
                    return;
                }

                const scaleX = naturalWidth / displayWidth;
                const scaleY = naturalHeight / displayHeight;
                const naturalCropSize = circleSize * ((scaleX + scaleY) / 2);
                if (naturalCropSize <= 0) {
                    showNotification('Calculated crop size is invalid.', 'error');
                    return;
                }

                const naturalCropX = cropX * scaleX;
                const naturalCropY = cropY * scaleY;

                const canvas = document.createElement('canvas');
                const finalSize = Math.floor(naturalCropSize);
                canvas.width = finalSize;
                canvas.height = finalSize;

                if (canvas.width === 0 || canvas.height === 0) {
                    showNotification('Canvas size calculation failed.', 'error');
                    return;
                }

                const ctx = canvas.getContext('2d');
                ctx.drawImage(
                    img,
                    naturalCropX - finalSize / 2,
                    naturalCropY - finalSize / 2,
                    finalSize, finalSize,
                    0, 0,
                    finalSize, finalSize
                );

                // Convert to PNG (safe and lossless)
                const blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/png');
                });

                if (!blob) {
                    showNotification('Failed to process image (Empty blob).', 'error');
                    return;
                }

                const fileName = `${currentUser.id}.png`;
                const { error: uploadError } = await supabaseClient.storage.from('avatars').upload(fileName, blob, {
                    upsert: true,
                    contentType: 'image/png'
                });

                if (uploadError) {
                    console.error('❌ Upload error:', uploadError);
                    showNotification('Failed to upload avatar.', 'error');
                    return;
                }

                const publicUrlData = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                const publicUrl = publicUrlData.data.publicUrl;
                const uploadTimestamp = Date.now();
                localStorage.setItem('barvassi_avatar_timestamp', uploadTimestamp);

                const { error: updateError } = await supabaseClient.from('clients').update({ avatar_url: publicUrl })
                    .eq('id', currentUser.id);

                if (updateError) {
                    console.error('❌ Update error:', updateError);
                    showNotification('Failed to save avatar URL.', 'error');
                    return;
                }

                userProfile.avatar_url = publicUrl;
                renderProfile();
                cropperModal.classList.remove('open');
                showNotification('Avatar updated!');
                selectedFile = null;

            } catch (err) {
                console.error('Cropper error:', err);
                showNotification('An error occurred.', 'error');
            } finally {
                this.classList.remove('loading');
                this.disabled = false;
            }
        });

        // ---- Trigger ----
        dropAvatar.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            // Extra validation on file type
            const allowedTypes = ['image/png', 'image/jpeg', 'image/jpg', 'image/webp', 'image/gif', 'image/bmp'];
            if (!allowedTypes.includes(file.type)) {
                showNotification('Please select a valid image (JPG, PNG, WebP, GIF, BMP).', 'error');
                avatarInput.value = '';
                return;
            }
            openCropper(file);
            avatarInput.value = '';
        });

        // ---- Start: Check session and load ----
        // Call this after all listeners are set up
        checkSessionAndLoad();
        loadBrandLogo();
    </script>
</body>
</html>
