<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · The Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            max-width: 100px;
            height: auto;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .logo-fallback {
            display: none;
            font-family: 'SF Pro Display', sans-serif;
            font-size: 28px;
            font-weight: 400;
            color: #f2f2f2;
            opacity: 0.8;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
        }
        
        .profile-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 32px;
            margin-top: 10px;
        }
        
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .user-name {
            font-weight: 500;
            font-size: 24px;
        }
        
        .user-name .badge {
            font-size: 18px;
            margin-left: 8px;
            vertical-align: middle;
        }
        
        .badge-blue {
            color: #4a90e2;
        }
        
        .badge-gold {
            color: #f5c518;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-weight: 300;
            opacity: 0.6;
        }
        
        .detail-value {
            font-weight: 400;
        }
        
        .edit-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px 16px;
            color: #f2f2f2;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 4px;
        }
        
        .edit-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 10px 24px;
            color: #f2f2f2;
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        
        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.05);
        }
        
        .btn-logout {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 24px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'SF Pro Display', sans-serif;
            font-weight: 300;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.5s ease;
            margin-top: 24px;
        }
        
        .btn-logout:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: #f2f2f2;
        }
        
        .hidden {
            display: none;
        }
        
        .edit-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }
        
        .edit-inline input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 12px;
            color: #f2f2f2;
            font-family: inherit;
            font-size: 14px;
            width: 100%;
            outline: none;
        }
        
        .edit-inline input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .edit-inline button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px 14px;
            color: #f2f2f2;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .edit-inline button:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .footer {
            margin-top: 40px;
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
        }
        
        @media (max-width: 600px) {
            .profile-card {
                padding: 20px;
            }
            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .edit-inline {
                width: 100%;
            }
            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="PASTE_YOUR_BASE64_LOGO_HERE" alt="Barvassi" class="logo" onerror="this.style.display='none'; document.getElementById('logoFallbackDash').style.display='block';" />
        <div id="logoFallbackDash" class="logo-fallback">Barvassi</div>

        <div class="profile-card" id="profileCard">
            <div class="profile-header">
                <div class="user-name" id="userNameDisplay">Loading…</div>
                <div id="badgeContainer"></div>
            </div>

            <div class="detail-row">
                <span class="detail-label">Barvassi ID</span>
                <span class="detail-value" id="accountIdDisplay">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Email</span>
                <span class="detail-value" id="emailDisplay">—</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Phone</span>
                <div class="detail-value" id="phoneDisplay">
                    <span id="phoneText">—</span>
                    <div class="edit-inline hidden" id="phoneEdit">
                        <input type="text" id="phoneInputEdit" placeholder="+963 99 123 4567" />
                        <button id="phoneSaveBtn">Save</button>
                        <button id="phoneCancelBtn">Cancel</button>
                    </div>
                    <button class="edit-btn" id="phoneEditBtn">Edit</button>
                </div>
            </div>
            <div class="detail-row">
                <span class="detail-label">Verification</span>
                <span class="detail-value" id="verificationDisplay">Unverified</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Subscription</span>
                <span class="detail-value" id="subscriptionDisplay">None</span>
            </div>

            <div class="action-buttons">
                <button class="btn-secondary" id="verifyBtn">Verify Identity</button>
                <button class="btn-secondary" id="upgradeBtn" disabled>Upgrade to Pro</button>
            </div>
        </div>

        <button class="btn-logout" id="logoutBtn">Exit the Vault</button>
        <div class="footer">© 2026 The House of Barvassi</div>
    </div>

    <script>
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {}

        // DOM refs
        const userNameDisplay = document.getElementById('userNameDisplay');
        const badgeContainer = document.getElementById('badgeContainer');
        const accountIdDisplay = document.getElementById('accountIdDisplay');
        const emailDisplay = document.getElementById('emailDisplay');
        const phoneText = document.getElementById('phoneText');
        const phoneEdit = document.getElementById('phoneEdit');
        const phoneInputEdit = document.getElementById('phoneInputEdit');
        const phoneEditBtn = document.getElementById('phoneEditBtn');
        const phoneSaveBtn = document.getElementById('phoneSaveBtn');
        const phoneCancelBtn = document.getElementById('phoneCancelBtn');
        const verificationDisplay = document.getElementById('verificationDisplay');
        const subscriptionDisplay = document.getElementById('subscriptionDisplay');
        const verifyBtn = document.getElementById('verifyBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        let currentUser = null;
        let userProfile = null;

        async function loadProfile() {
            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            // Fetch profile from clients table
            const {
                data,
                error
            } = await supabaseClient
                .from('clients')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) {
                console.error('Profile fetch error:', error);
                return;
            }
            userProfile = data;
            renderProfile();
        }

        function renderProfile() {
            const p = userProfile;
            userNameDisplay.textContent = p.full_name || 'Member';
            accountIdDisplay.textContent = p.account_id || '—';
            emailDisplay.textContent = p.email;
            phoneText.textContent = p.phone || '—';
            verificationDisplay.textContent = p.verification_status === 'verified' ? 'Verified' :
                p.verification_status === 'pro' ? 'Pro' : 'Unverified';
            subscriptionDisplay.textContent = p.subscription_status === 'pro' ? 'Pro' : 'None';

            // Badge
            badgeContainer.innerHTML = '';
            if (p.verification_status === 'verified') {
                badgeContainer.innerHTML = '<span class="badge badge-blue">✓</span>';
            } else if (p.verification_status === 'pro') {
                badgeContainer.innerHTML = '<span class="badge badge-gold">★</span>';
            }

            // Enable/disable upgrade button
            upgradeBtn.disabled = p.verification_status !== 'verified';
        }

        // --- Edit phone ---
        phoneEditBtn.addEventListener('click', () => {
            phoneText.classList.add('hidden');
            phoneEdit.classList.remove('hidden');
            phoneInputEdit.value = userProfile.phone || '';
        });

        phoneCancelBtn.addEventListener('click', () => {
            phoneEdit.classList.add('hidden');
            phoneText.classList.remove('hidden');
        });

        phoneSaveBtn.addEventListener('click', async() => {
            const newPhone = phoneInputEdit.value.trim();
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    phone: newPhone
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Update error:', error);
                alert('Failed to update phone.');
            } else {
                userProfile.phone = newPhone;
                phoneText.textContent = newPhone || '—';
                phoneEdit.classList.add('hidden');
                phoneText.classList.remove('hidden');
            }
        });

        // --- Verify Identity (placeholder) ---
        verifyBtn.addEventListener('click', async() => {
            if (userProfile.verification_status !== 'unverified') {
                alert('Already verified or pro.');
                return;
            }
            // For demo, we'll just set it to 'verified'
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    verification_status: 'verified'
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Verification error:', error);
                alert('Verification failed.');
            } else {
                userProfile.verification_status = 'verified';
                renderProfile();
                alert('Identity verified!');
            }
        });

        // --- Upgrade to Pro (only if verified) ---
        upgradeBtn.addEventListener('click', async() => {
            if (userProfile.verification_status !== 'verified') {
                alert('Please verify your identity first.');
                return;
            }
            // For demo, we set to 'pro'
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    verification_status: 'pro',
                    subscription_status: 'pro'
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Upgrade error:', error);
                alert('Upgrade failed.');
            } else {
                userProfile.verification_status = 'pro';
                userProfile.subscription_status = 'pro';
                renderProfile();
                alert('Welcome to Pro!');
            }
        });

        // --- Logout ---
        logoutBtn.addEventListener('click', async() => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // --- Inactivity timer (optional, keep from earlier) ---
        let inactivityTimer;

        function resetTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                alert('Your session has expired due to inactivity.');
                supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }, 3600000);
        }
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('mousedown', resetTimer);
        document.addEventListener('keypress', resetTimer);
        resetTimer();

        // --- Init ---
        loadProfile();
    </script>
</body>

</html>
