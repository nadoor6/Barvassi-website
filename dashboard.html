<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · The Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .box {
            text-align: center;
            max-width: 500px;
            padding: 20px;
        }
        
        .logo {
            max-width: 120px;
            height: auto;
            margin-bottom: 20px;
            opacity: 0.8;
        }
        
        .title {
            font-weight: 500;
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .sub {
            font-weight: 300;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 30px;
        }
        
        .btn-exit {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 12px 32px;
            color: #f2f2f2;
            font-weight: 300;
            font-size: 12px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.5s ease;
            font-family: 'SF Pro Display', sans-serif;
        }
        
        .btn-exit:hover {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .footer {
            margin-top: 40px;
            font-weight: 300;
            font-size: 9px;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.06);
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="logo.png" alt="Barvassi" class="logo" />
        <div class="title" id="welcomeText">The vault is open.</div>
        <div class="sub">You have entered the House.</div>
        <button class="btn-exit" id="logoutBtn">Exit the Vault</button>
        <div class="footer">© 2026 The House of Barvassi</div>
    </div>

    <script>
        // Connect to your database from config.js
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if user is actually logged in
        supabase.auth.getSession().then(({
            data: {
                session
            }
        }) => {
            if (!session) {
                window.location.href = 'index.html'; // Kick them out if not logged in
            } else {
                document.getElementById('welcomeText').innerText = `Welcome, ${session.user.email.split('@')[0]}.`;
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            await supabase.auth.signOut();
            window.location.href = 'index.html';
        });
    </script>
</body>

</html>
