<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Barvassi · The Vault</title>
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet" />
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background: #0c0c0c;
            color: #f2f2f2;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 32px;
        }
        /* ---- TOP BAR ---- */
        
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        .brand {
            font-weight: 500;
            font-size: 20px;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .brand img {
            height: 28px;
            width: auto;
        }
        
        .top-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .avatar-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.3s;
            position: relative;
        }
        
        .avatar-btn:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-btn .initials {
            font-weight: 400;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
        }
        /* ---- PROFILE DROPDOWN (glass) ---- */
        
        .dropdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
        
        .dropdown-overlay.open {
            pointer-events: auto;
        }
        
        .dropdown {
            position: absolute;
            top: 80px;
            right: 32px;
            width: 360px;
            max-width: 90vw;
            background: rgba(12, 12, 12, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: translateY(-10px) scale(0.96);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: none;
        }
        
        .dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        
        .dropdown-profile {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .dropdown-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            flex-shrink: 0;
            position: relative;
            cursor: pointer;
        }
        
        .dropdown-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .dropdown-avatar .initials {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 400;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .dropdown-avatar .upload-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 12px;
            color: #f2f2f2;
        }
        
        .dropdown-avatar:hover .upload-overlay {
            opacity: 1;
        }
        
        .dropdown-info {
            flex: 1;
        }
        
        .dropdown-info .name {
            font-weight: 500;
            font-size: 16px;
        }
        
        .dropdown-info .email {
            font-weight: 300;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .dropdown-info .badge {
            font-size: 14px;
            margin-left: 6px;
            vertical-align: middle;
        }
        
        .badge-blue {
            color: #4a90e2;
        }
        
        .badge-gold {
            color: #f5c518;
        }
        
        .dropdown-details {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
            margin-top: 16px;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-weight: 300;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .detail-row .val {
            color: #f2f2f2;
        }
        
        .detail-row .edit-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            justify-content: flex-end;
        }
        
        .detail-row .edit-inline input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 8px;
            color: #f2f2f2;
            font-family: inherit;
            font-size: 13px;
            width: 140px;
            outline: none;
        }
        
        .detail-row .edit-inline input:focus {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .detail-row .edit-inline button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 4px 10px;
            color: #f2f2f2;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .detail-row .edit-inline button:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .detail-row .edit-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-left: 8px;
            transition: color 0.3s;
        }
        
        .detail-row .edit-btn:hover {
            color: rgba(255, 255, 255, 0.6);
        }
        
        .dropdown-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 16px;
        }
        
        .dropdown-actions button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 8px 0;
            font-family: inherit;
            font-size: 12px;
            font-weight: 300;
            color: #f2f2f2;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        
        .dropdown-actions button:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.02);
        }
        
        .dropdown-actions button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .logout-btn {
            margin-top: 4px;
            border-color: rgba(255, 255, 255, 0.05) !important;
            color: rgba(255, 255, 255, 0.3) !important;
        }
        
        .logout-btn:hover {
            border-color: rgba(255, 255, 255, 0.15) !important;
            color: #f2f2f2 !important;
        }
        /* ---- MAIN DASHBOARD CONTENT (placeholder) ---- */
        
        .main-content {
            margin-top: 40px;
            text-align: center;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .main-content h2 {
            font-weight: 400;
            font-size: 28px;
            opacity: 0.6;
            letter-spacing: 0.05em;
        }
        
        .main-content p {
            font-weight: 300;
            font-size: 14px;
            opacity: 0.3;
            margin-top: 8px;
        }
        /* ---- FILE INPUT (hidden) ---- */
        
        #avatarInput {
            display: none;
        }
        /* ---- RESPONSIVE ---- */
        
        @media (max-width: 600px) {
            .dashboard-container {
                padding: 16px;
            }
            .dropdown {
                right: 16px;
                width: 320px;
            }
            .top-bar {
                flex-wrap: wrap;
                gap: 12px;
            }
            .brand {
                font-size: 18px;
            }
            .brand img {
                height: 24px;
            }
            .avatar-btn {
                width: 40px;
                height: 40px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard-container">

        <!-- TOP BAR -->
        <header class="top-bar">
            <div class="brand">
                <img src="PASTE_YOUR_BASE64_LOGO_HERE" alt="Barvassi" onerror="this.style.display='none'; document.getElementById('brandText').style.display='block';" />
                <span id="brandText" style="display:none;">Barvassi</span>
                <span style="font-weight:300; font-size:14px; opacity:0.4;">· The Vault</span>
            </div>
            <div class="top-right">
                <button class="avatar-btn" id="avatarBtn">
                    <span class="initials" id="avatarInitials">B</span>
                    <img id="avatarImg" style="display:none;" alt="" />
                </button>
            </div>
        </header>

        <!-- DROPDOWN OVERLAY & CONTAINER -->
        <div class="dropdown-overlay" id="dropdownOverlay">
            <div class="dropdown" id="dropdown">
                <!-- Profile header -->
                <div class="dropdown-profile">
                    <div class="dropdown-avatar" id="dropAvatar">
                        <span class="initials" id="dropInitials">B</span>
                        <img id="dropImg" style="display:none;" alt="" />
                        <div class="upload-overlay">Upload</div>
                    </div>
                    <div class="dropdown-info">
                        <div class="name" id="dropName">Loading…</div>
                        <div class="email" id="dropEmail">—</div>
                    </div>
                </div>

                <!-- Details -->
                <div class="dropdown-details">
                    <div class="detail-row">
                        <span>Barvassi ID</span>
                        <span class="val" id="dropId">—</span>
                    </div>
                    <div class="detail-row">
                        <span>Email</span>
                        <span class="val" id="dropEmailDetail">—</span>
                    </div>
                    <div class="detail-row">
                        <span>Phone</span>
                        <span class="val" id="dropPhoneText">—</span>
                        <div class="edit-inline" id="dropPhoneEdit" style="display:none;">
                            <input type="text" id="phoneInputEdit" placeholder="+963 99 123 4567" />
                            <button id="phoneSaveBtn">Save</button>
                            <button id="phoneCancelBtn">Cancel</button>
                        </div>
                        <button class="edit-btn" id="phoneEditBtn">Edit</button>
                    </div>
                    <div class="detail-row">
                        <span>Verification</span>
                        <span class="val" id="dropVerification">Unverified</span>
                    </div>
                    <div class="detail-row">
                        <span>Subscription</span>
                        <span class="val" id="dropSubscription">None</span>
                    </div>
                </div>

                <!-- Actions -->
                <div class="dropdown-actions">
                    <button id="verifyBtn">Verify Identity</button>
                    <button id="upgradeBtn" disabled>Upgrade to Pro</button>
                    <button class="logout-btn" id="logoutBtn">Exit the Vault</button>
                </div>
            </div>
        </div>

        <!-- MAIN CONTENT (future dashboard sections) -->
        <section class="main-content">
            <h2>Welcome to the Vault.</h2>
            <p>The chambers are being prepared.</p>
        </section>

    </div>

    <!-- Hidden file input for avatar upload -->
    <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/jpg,image/webp" />

    <script>
        // ===== INIT SUPABASE =====
        let supabaseClient = null;
        try {
            if (typeof SUPABASE_URL !== 'undefined' && typeof SUPABASE_ANON_KEY !== 'undefined') {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch (e) {}

        // ===== DOM REFS =====
        const avatarBtn = document.getElementById('avatarBtn');
        const avatarInitials = document.getElementById('avatarInitials');
        const avatarImg = document.getElementById('avatarImg');
        const dropAvatar = document.getElementById('dropAvatar');
        const dropInitials = document.getElementById('dropInitials');
        const dropImg = document.getElementById('dropImg');
        const dropName = document.getElementById('dropName');
        const dropEmail = document.getElementById('dropEmail');
        const dropId = document.getElementById('dropId');
        const dropEmailDetail = document.getElementById('dropEmailDetail');
        const dropPhoneText = document.getElementById('dropPhoneText');
        const dropPhoneEdit = document.getElementById('dropPhoneEdit');
        const phoneInputEdit = document.getElementById('phoneInputEdit');
        const phoneSaveBtn = document.getElementById('phoneSaveBtn');
        const phoneCancelBtn = document.getElementById('phoneCancelBtn');
        const phoneEditBtn = document.getElementById('phoneEditBtn');
        const dropVerification = document.getElementById('dropVerification');
        const dropSubscription = document.getElementById('dropSubscription');
        const verifyBtn = document.getElementById('verifyBtn');
        const upgradeBtn = document.getElementById('upgradeBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const dropdownOverlay = document.getElementById('dropdownOverlay');
        const dropdown = document.getElementById('dropdown');
        const avatarInput = document.getElementById('avatarInput');

        let currentUser = null;
        let userProfile = null;

        // ===== LOAD PROFILE =====
        async function loadProfile() {
            const {
                data: {
                    session
                }
            } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = session.user;

            const {
                data,
                error
            } = await supabaseClient
                .from('clients')
                .select('*')
                .eq('id', currentUser.id)
                .single();

            if (error) {
                console.error('Profile fetch error:', error);
                return;
            }
            userProfile = data;
            renderProfile();
        }

        // ===== RENDER PROFILE =====
        function renderProfile() {
            const p = userProfile;
            const name = p.full_name || 'Member';
            const initial = name.charAt(0).toUpperCase();

            // Avatar button
            if (p.avatar_url) {
                avatarImg.src = p.avatar_url;
                avatarImg.style.display = 'block';
                avatarInitials.style.display = 'none';
                dropImg.src = p.avatar_url;
                dropImg.style.display = 'block';
                dropInitials.style.display = 'none';
            } else {
                avatarImg.style.display = 'none';
                avatarInitials.style.display = 'block';
                avatarInitials.textContent = initial;
                dropImg.style.display = 'none';
                dropInitials.style.display = 'block';
                dropInitials.textContent = initial;
            }

            // Info
            dropName.textContent = name;
            dropEmail.textContent = p.email;
            dropId.textContent = p.account_id || '—';
            dropEmailDetail.textContent = p.email;
            dropPhoneText.textContent = p.phone || '—';
            dropVerification.textContent = p.verification_status === 'verified' ? 'Verified' :
                p.verification_status === 'pro' ? 'Pro' : 'Unverified';
            dropSubscription.textContent = p.subscription_status === 'pro' ? 'Pro' : 'None';

            // Badge (in name area)
            const badgeSpan = document.querySelector('.dropdown-info .badge');
            if (p.verification_status === 'verified') {
                badgeSpan.innerHTML = '<span class="badge badge-blue">✓</span>';
            } else if (p.verification_status === 'pro') {
                badgeSpan.innerHTML = '<span class="badge badge-gold">★</span>';
            } else {
                badgeSpan.innerHTML = '';
            }

            // Enable/disable upgrade
            upgradeBtn.disabled = p.verification_status !== 'verified';
        }

        // ===== TOGGLE DROPDOWN =====
        function openDropdown() {
            dropdownOverlay.classList.add('open');
            dropdown.classList.add('open');
            // Close phone edit if open
            phoneEditBtn.style.display = 'inline-block';
            dropPhoneEdit.style.display = 'none';
            dropPhoneText.style.display = 'inline';
        }

        function closeDropdown() {
            dropdownOverlay.classList.remove('open');
            dropdown.classList.remove('open');
        }
        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (dropdown.classList.contains('open')) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });
        dropdownOverlay.addEventListener('click', (e) => {
            if (e.target === dropdownOverlay) closeDropdown();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDropdown();
        });

        // ===== PHONE EDIT =====
        phoneEditBtn.addEventListener('click', () => {
            phoneEditBtn.style.display = 'none';
            dropPhoneText.style.display = 'none';
            dropPhoneEdit.style.display = 'flex';
            phoneInputEdit.value = userProfile.phone || '';
        });
        phoneCancelBtn.addEventListener('click', () => {
            dropPhoneEdit.style.display = 'none';
            dropPhoneText.style.display = 'inline';
            phoneEditBtn.style.display = 'inline-block';
        });
        phoneSaveBtn.addEventListener('click', async() => {
            const newPhone = phoneInputEdit.value.trim();
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    phone: newPhone
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Update error:', error);
                alert('Failed to update phone.');
            } else {
                userProfile.phone = newPhone;
                dropPhoneText.textContent = newPhone || '—';
                dropPhoneEdit.style.display = 'none';
                dropPhoneText.style.display = 'inline';
                phoneEditBtn.style.display = 'inline-block';
            }
        });

        // ===== VERIFY IDENTITY (demo) =====
        verifyBtn.addEventListener('click', async() => {
            if (userProfile.verification_status !== 'unverified') {
                alert('Already verified or pro.');
                return;
            }
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    verification_status: 'verified'
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Verification error:', error);
                alert('Verification failed.');
            } else {
                userProfile.verification_status = 'verified';
                renderProfile();
                alert('Identity verified!');
            }
        });

        // ===== UPGRADE TO PRO =====
        upgradeBtn.addEventListener('click', async() => {
            if (userProfile.verification_status !== 'verified') {
                alert('Please verify your identity first.');
                return;
            }
            const {
                error
            } = await supabaseClient
                .from('clients')
                .update({
                    verification_status: 'pro',
                    subscription_status: 'pro'
                })
                .eq('id', currentUser.id);
            if (error) {
                console.error('Upgrade error:', error);
                alert('Upgrade failed.');
            } else {
                userProfile.verification_status = 'pro';
                userProfile.subscription_status = 'pro';
                renderProfile();
                alert('Welcome to Pro!');
            }
        });

        // ===== AVATAR UPLOAD =====
        dropAvatar.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', async(e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Upload to Supabase Storage
            const fileExt = file.name.split('.').pop();
            const fileName = `${currentUser.id}.${fileExt}`;
            const {
                error: uploadError
            } = await supabaseClient.storage
                .from('avatars')
                .upload(fileName, file, {
                    upsert: true
                });

            if (uploadError) {
                console.error('Upload error:', uploadError);
                alert('Failed to upload avatar.');
                return;
            }

            // Get public URL
            const {
                data: {
                    publicUrl
                }
            } = supabaseClient.storage
                .from('avatars')
                .getPublicUrl(fileName);

            // Update profile with avatar_url
            const {
                error: updateError
            } = await supabaseClient
                .from('clients')
                .update({
                    avatar_url: publicUrl
                })
                .eq('id', currentUser.id);

            if (updateError) {
                console.error('Update avatar error:', updateError);
                alert('Failed to save avatar URL.');
                return;
            }

            userProfile.avatar_url = publicUrl;
            renderProfile();
            alert('Avatar updated!');
            avatarInput.value = '';
        });

        // ===== LOGOUT =====
        logoutBtn.addEventListener('click', async() => {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        });

        // ===== INACTIVITY TIMER =====
        let inactivityTimer;

        function resetTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                alert('Your session has expired due to inactivity.');
                supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            }, 3600000);
        }
        document.addEventListener('mousemove', resetTimer);
        document.addEventListener('mousedown', resetTimer);
        document.addEventListener('keypress', resetTimer);
        resetTimer();

        // ===== INIT =====
        loadProfile();
    </script>
</body>

</html>
